<script>
'use strict';

// =============================================================================
// Helpers
// =============================================================================

const $ = (tag, props = {}, ...children) => {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value == null || value === false) continue;
    if (key === 'class') el.className = value;
    else if (key === 'style') el.style.cssText = value;
    else if (key === 'dataset') Object.assign(el.dataset, value);
    else if (key.startsWith('on')) el.addEventListener(key.slice(2), value);
    else if (key in el && key !== 'list' && key !== 'form') el[key] = value;
    else el.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    el.append(child instanceof Node ? child : String(child));
  }
  return el;
};

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function plural(count, singular, pluralText) {
  if (count === 1) return '1 ' + singular;
  return `${count} ${pluralText || singular + 's'}`;
}

const utf8 = new TextDecoder('utf-8');

function base64ToBytes(text) {
  const binary = atob(text.replace(/\s+/g, ''));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function bytesToBase64(bytes) {
  let binary = '';
  for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(binary);
}

function fileExtension(name) {
  const dot = name.lastIndexOf('.');
  return dot === -1 ? '' : name.slice(dot + 1).toLowerCase();
}

function toast(message, ms = 4000) {
  const el = $('div', { class: 'toast', role: 'status' }, message);
  document.body.append(el);
  setTimeout(() => el.remove(), ms);
}

function showBusy(message) {
  const el = $('div', { class: 'busy' }, $('div', {}, message));
  document.body.append(el);
  return () => el.remove();
}

// Lets the browser draw before a long piece of work starts.
const nextFrame = () => new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 0)));

// SHA-256, used to name media files by their contents.
async function sha256Hex(bytes) {
  if (globalThis.crypto && crypto.subtle) {
    const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
    return Array.from(digest, b => b.toString(16).padStart(2, '0')).join('');
  }
  return sha256Fallback(bytes);
}

// Plain-script SHA-256 for browsers that hide crypto.subtle (some file:// pages).
function sha256Fallback(bytes) {
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const length = bytes.length;
  const padded = new Uint8Array(((length + 9 + 63) >> 6) << 6);
  padded.set(bytes);
  padded[length] = 0x80;
  const view = new DataView(padded.buffer);
  view.setUint32(padded.length - 8, Math.floor(length / 0x20000000));
  view.setUint32(padded.length - 4, (length << 3) >>> 0);
  const w = new Uint32Array(64);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let offset = 0; offset < padded.length; offset += 64) {
    for (let i = 0; i < 16; i++) w[i] = view.getUint32(offset + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
      const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0;
      const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    [a, b, c, d, e, f, g, h].forEach((value, i) => { H[i] = (H[i] + value) >>> 0; });
  }
  return H.map(x => x.toString(16).padStart(8, '0')).join('');
}

// =============================================================================
// Storage: the only code that knows where data is kept.
// The collection is one JSON text, like user://flashcards.json in the Godot
// app. Media files are Blobs under "media/<name>", like user://media/.
// IndexedDB is used when it is available; otherwise localStorage, which
// holds less and keeps media only until the page is closed.
// =============================================================================

const Storage = (() => {
  let db = null;
  const memory = new Map();

  function open() {
    return new Promise(resolve => {
      try {
        const request = indexedDB.open('flashcards', 1);
        request.onupgradeneeded = () => request.result.createObjectStore('files');
        request.onsuccess = () => { db = request.result; resolve(true); };
        request.onerror = () => resolve(false);
        request.onblocked = () => resolve(false);
      } catch (error) {
        resolve(false);
      }
    });
  }

  function transaction(mode, work) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction('files', mode);
      const request = work(tx.objectStore('files'));
      tx.oncomplete = () => resolve(request ? request.result : undefined);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  }

  async function get(key) {
    if (db) return transaction('readonly', store => store.get(key));
    if (memory.has(key)) return memory.get(key);
    try { return localStorage.getItem('flashcards:' + key) ?? undefined; } catch (error) { return undefined; }
  }

  async function put(key, value) {
    if (db) return transaction('readwrite', store => store.put(value, key));
    if (typeof value === 'string') {
      try { localStorage.setItem('flashcards:' + key, value); return; } catch (error) { /* fall through to memory */ }
    }
    memory.set(key, value);
  }

  async function has(key) {
    if (db) return (await transaction('readonly', store => store.count(key))) > 0;
    return (await get(key)) !== undefined;
  }

  async function remove(key) {
    if (db) return transaction('readwrite', store => store.delete(key));
    memory.delete(key);
    try { localStorage.removeItem('flashcards:' + key); } catch (error) { /* ignore */ }
  }

  async function keys(prefix) {
    if (db) {
      const all = await transaction('readonly', store => store.getAllKeys());
      return all.filter(key => String(key).startsWith(prefix));
    }
    const result = [...memory.keys()].filter(key => key.startsWith(prefix));
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('flashcards:' + prefix)) result.push(key.slice('flashcards:'.length));
      }
    } catch (error) { /* ignore */ }
    return result;
  }

  return { open, get, put, has, remove, keys, get persistent() { return db !== null; } };
})();

// =============================================================================
// Media: stores the images and sounds used on cards.
// Every file is named after a hash of its contents, so the same picture added
// twice is stored once, and a name always refers to the same contents.
// =============================================================================

const Media = (() => {
  const IMAGE_TYPES = ['png', 'jpg', 'jpeg', 'webp', 'svg', 'bmp', 'gif'];
  const AUDIO_TYPES = ['wav', 'ogg', 'oga', 'opus', 'mp3', 'webm', 'm4a', 'aac', 'flac'];
  const MIME = {
    png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', svg: 'image/svg+xml',
    bmp: 'image/bmp', gif: 'image/gif', wav: 'audio/wav', ogg: 'audio/ogg', oga: 'audio/ogg',
    opus: 'audio/ogg', mp3: 'audio/mpeg', webm: 'audio/webm', m4a: 'audio/mp4', aac: 'audio/aac', flac: 'audio/flac',
  };
  const urls = new Map();

  function isPlainName(name) {
    return !!name && !name.includes('/') && !name.includes('\\') && !name.includes('..');
  }

  // Saves bytes and returns the stored file's name, or '' on failure.
  async function storeBytes(bytes, extension) {
    try {
      extension = (extension || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '') || 'bin';
      const name = (await sha256Hex(bytes)).slice(0, 24) + '.' + extension;
      if (!(await Storage.has('media/' + name))) {
        await Storage.put('media/' + name, new Blob([bytes], { type: MIME[extension] || 'application/octet-stream' }));
      }
      return name;
    } catch (error) {
      console.error('Could not store media', error);
      return '';
    }
  }

  async function storeBlob(blob, extension) {
    return storeBytes(new Uint8Array(await blob.arrayBuffer()), extension);
  }

  // Returns an object URL for a stored file, or null if it cannot be shown.
  async function url(name) {
    if (!isPlainName(name)) return null;
    if (urls.has(name)) return urls.get(name);
    const blob = await Storage.get('media/' + name);
    if (!(blob instanceof Blob)) return null;
    const objectUrl = URL.createObjectURL(blob);
    urls.set(name, objectUrl);
    return objectUrl;
  }

  async function imageUrl(name) {
    return IMAGE_TYPES.includes(fileExtension(name)) ? url(name) : null;
  }

  function canPlay(name) {
    const extension = fileExtension(name);
    if (!AUDIO_TYPES.includes(extension)) return false;
    return new Audio().canPlayType(MIME[extension]) !== '';
  }

  async function audioUrl(name) {
    return canPlay(name) ? url(name) : null;
  }

  // Fills in every <img data-media> inside an element, or shows a placeholder.
  function hydrate(root) {
    for (const img of root.querySelectorAll('img[data-media]')) {
      const name = img.dataset.media;
      imageUrl(name).then(src => {
        if (src) {
          img.src = src;
        } else {
          img.replaceWith($('i', { class: 'missing' }, `[image: ${img.alt || name}]`));
        }
      });
    }
  }

  return { IMAGE_TYPES, AUDIO_TYPES, MIME, isPlainName, storeBytes, storeBlob, url, imageUrl, audioUrl, canPlay, hydrate };
})();

// =============================================================================
// DataManager: owns every card and deck, and is the only code that knows how
// they are stored. Screens call the functions below and listen for changes.
//
//   deck   = { id, name }
//   card   = { id, front: side, back: side, review }
//   side   = { text, audio: [media file names] }
//   review = { level, is_new, due_day, deferred_day }
// =============================================================================

const DataManager = (() => {
  const SAVE_KEY = 'flashcards.json';
  const FORMAT_VERSION = 2;
  // Pass as a scope to mean "every card" instead of one deck. Real ids start at 1.
  const ALL_CARDS = 0;

  const cards = new Map();      // card_id -> card
  const decks = new Map();      // deck_id -> deck
  const deckCards = new Map();  // deck_id -> Set of card ids, in the order cards were added
  const cardDecks = new Map();  // card_id -> Set of deck ids
  const listeners = new Set();
  let nextId = 1;
  let batchDepth = 0;
  let batchDirty = false;
  let saving = Promise.resolve();

  const makeSide = (text = '', audio = []) => ({ text, audio: [...audio] });
  const newReview = () => ({ level: 0, is_new: true, due_day: 0, deferred_day: -1 });
  const clone = value => structuredClone(value);

  function onChanged(listener) { listeners.add(listener); }

  // --- Batches: several changes, one save and one "changed".
  function beginBatch() { batchDepth += 1; }
  function endBatch() {
    batchDepth -= 1;
    if (batchDepth === 0 && batchDirty) {
      batchDirty = false;
      commit();
    }
  }

  // --- Decks
  function getDecks() {
    return [...decks.values()].map(clone)
      .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
  }
  const getDeck = deckId => (decks.has(deckId) ? clone(decks.get(deckId)) : null);
  const hasDeck = deckId => decks.has(deckId);

  // Returns the id of the deck with this name, ignoring case, or -1.
  function findDeck(deckName) {
    const wanted = deckName.trim().toLowerCase();
    for (const deck of decks.values()) {
      if (deck.name.toLowerCase() === wanted) return deck.id;
    }
    return -1;
  }

  function createDeck(deckName) {
    const deckId = takeId();
    decks.set(deckId, { id: deckId, name: deckName.trim() });
    deckCards.set(deckId, new Set());
    commit();
    return deckId;
  }

  function renameDeck(deckId, newName) {
    if (!decks.has(deckId)) return;
    decks.get(deckId).name = newName.trim();
    commit();
  }

  // Deletes a deck. Its cards are kept, and stay in any other decks they belong to.
  function deleteDeck(deckId) {
    if (!decks.has(deckId)) return;
    for (const cardId of deckCards.get(deckId)) cardDecks.get(cardId).delete(deckId);
    deckCards.delete(deckId);
    decks.delete(deckId);
    commit();
  }

  // --- Cards
  function getCardIds(scope = ALL_CARDS) {
    if (scope === ALL_CARDS) return [...cards.keys()];
    return [...(deckCards.get(scope) || [])];
  }
  const getCards = (scope = ALL_CARDS) => getCardIds(scope).map(id => clone(cards.get(id)));
  const getCard = cardId => (cards.has(cardId) ? clone(cards.get(cardId)) : null);
  const hasCard = cardId => cards.has(cardId);
  const cardCount = (scope = ALL_CARDS) => (scope === ALL_CARDS ? cards.size : (deckCards.get(scope)?.size || 0));
  const getCardDeckIds = cardId => [...(cardDecks.get(cardId) || [])];

  function createCard(front, back, deckIds = []) {
    const cardId = takeId();
    cards.set(cardId, { id: cardId, front: clone(front), back: clone(back), review: newReview() });
    cardDecks.set(cardId, new Set());
    for (const deckId of deckIds) link(deckId, cardId);
    commit();
    return cardId;
  }

  // Replaces both sides of a card. The change appears in every deck that holds it.
  function updateCard(cardId, front, back) {
    if (!cards.has(cardId)) return;
    Object.assign(cards.get(cardId), { front: clone(front), back: clone(back) });
    commit();
  }

  // Makes a card belong to exactly the given decks.
  function setCardDecks(cardId, deckIds) {
    if (!cards.has(cardId)) return;
    for (const deckId of getCardDeckIds(cardId)) {
      if (!deckIds.includes(deckId)) unlink(deckId, cardId);
    }
    for (const deckId of deckIds) link(deckId, cardId);
    commit();
  }

  function addCardToDeck(deckId, cardId) {
    if (cards.has(cardId) && link(deckId, cardId)) commit();
  }

  // Takes a card out of one deck. The card itself is kept.
  function removeCardFromDeck(deckId, cardId) {
    if (unlink(deckId, cardId)) commit();
  }

  // Deletes a card everywhere: from the collection and from every deck.
  function deleteCard(cardId) {
    if (!cards.has(cardId)) return;
    for (const deckId of getCardDeckIds(cardId)) unlink(deckId, cardId);
    cardDecks.delete(cardId);
    cards.delete(cardId);
    commit();
  }

  // --- Review progress. It belongs to the card, so every deck shares it.
  function setReview(cardId, review) {
    if (!cards.has(cardId)) return;
    cards.get(cardId).review = { ...review };
    commit();
  }

  function resetProgress(cardIds) {
    for (const cardId of cardIds) {
      if (cards.has(cardId)) cards.get(cardId).review = newReview();
    }
    commit();
  }

  // --- Internals
  function takeId() { return nextId++; }

  function link(deckId, cardId) {
    if (!decks.has(deckId) || deckCards.get(deckId).has(cardId)) return false;
    deckCards.get(deckId).add(cardId);
    cardDecks.get(cardId).add(deckId);
    return true;
  }

  function unlink(deckId, cardId) {
    if (!deckCards.has(deckId) || !deckCards.get(deckId).has(cardId)) return false;
    deckCards.get(deckId).delete(cardId);
    cardDecks.get(cardId).delete(deckId);
    return true;
  }

  function commit() {
    if (batchDepth > 0) {
      batchDirty = true;
      return;
    }
    save();
    for (const listener of listeners) listener();
  }

  function createSampleDeck() {
    beginBatch();
    const deckId = createDeck('Sample Deck');
    createCard(makeSide('What is the capital of France?'), makeSide('Paris'), [deckId]);
    createCard(makeSide('What does HTTP stand for?'), makeSide('HyperText Transfer Protocol'), [deckId]);
    createCard(makeSide('In what year did World War II end?'), makeSide('1945'), [deckId]);
    endBatch();
    return deckId;
  }

  // --- Storage. Everything below is the only code that knows about the save file.

  function toSnapshot() {
    const links = [];
    for (const [deckId, ids] of deckCards) {
      for (const cardId of ids) links.push({ deck_id: deckId, card_id: cardId });
    }
    return {
      version: FORMAT_VERSION,
      next_id: nextId,
      decks: [...decks.values()],
      cards: [...cards.values()],
      deck_cards: links,
    };
  }

  function fromSnapshot(data) {
    decks.clear(); cards.clear(); deckCards.clear(); cardDecks.clear();
    let highestId = 0;
    for (const deck of data.decks || []) {
      const deckId = Math.trunc(Number(deck.id));
      decks.set(deckId, { id: deckId, name: String(deck.name) });
      deckCards.set(deckId, new Set());
      highestId = Math.max(highestId, deckId);
    }
    for (const card of data.cards || []) {
      const cardId = Math.trunc(Number(card.id));
      cards.set(cardId, { id: cardId, front: readSide(card.front), back: readSide(card.back), review: readReview(card.review) });
      cardDecks.set(cardId, new Set());
      highestId = Math.max(highestId, cardId);
    }
    for (const entry of data.deck_cards || []) {
      const cardId = Math.trunc(Number(entry.card_id));
      if (cards.has(cardId)) link(Math.trunc(Number(entry.deck_id)), cardId);
    }
    nextId = Math.max(Math.trunc(Number(data.next_id || 1)), highestId + 1);
  }

  // Version 1 stored each side as a plain string. Version 2 stores an object.
  function readSide(value) {
    if (typeof value === 'string') return makeSide(value);
    value = value || {};
    return makeSide(String(value.text ?? ''), (value.audio || []).map(String));
  }

  // Version 1 had no review progress, so cards from it start as new.
  function readReview(value) {
    if (!value || typeof value !== 'object') return newReview();
    return {
      level: Math.trunc(Number(value.level ?? 0)),
      is_new: Boolean(value.is_new ?? true),
      due_day: Math.trunc(Number(value.due_day ?? 0)),
      deferred_day: Math.trunc(Number(value.deferred_day ?? -1)),
    };
  }

  function save() {
    const text = JSON.stringify(toSnapshot());
    // Saves run one after another, so an older snapshot never lands last.
    saving = saving.then(() => Storage.put(SAVE_KEY, text)).catch(error => {
      console.error(error);
      toast('Could not save flashcards: ' + (error && error.message || error));
    });
    return saving;
  }

  // Returns false if there was no usable save.
  async function load() {
    const text = await Storage.get(SAVE_KEY);
    if (text === undefined || text === null) return false;
    let data = null;
    try { data = JSON.parse(text); } catch (error) { data = null; }
    if (!data || typeof data !== 'object' || Array.isArray(data)) {
      await setAside(text, '.unreadable', 'The saved flashcards could not be read.');
      return false;
    }
    const version = Math.trunc(Number(data.version ?? 1));
    if (version > FORMAT_VERSION) {
      await setAside(text, '.newer', 'The saved flashcards are from a newer version of the app.');
      return false;
    }
    if (version < FORMAT_VERSION) {
      // Keep the old save untouched in case the upgrade goes wrong.
      await Storage.put(`${SAVE_KEY}.v${version}.bak`, text);
    }
    fromSnapshot(data);
    if (version < FORMAT_VERSION) await save();
    return true;
  }

  // Moves the save out of the way so that nothing overwrites it.
  async function setAside(text, suffix, reason) {
    await Storage.put(SAVE_KEY + suffix, text);
    await Storage.remove(SAVE_KEY);
    console.error(`${reason} It was kept as ${SAVE_KEY + suffix}.`);
    toast(`${reason} It was kept aside, and a fresh collection was started.`, 8000);
  }

  // Replaces the whole collection, as when restoring a backup.
  function restore(data) {
    fromSnapshot(data);
    commit();
  }

  return {
    ALL_CARDS, onChanged, makeSide, newReview, beginBatch, endBatch,
    getDecks, getDeck, hasDeck, findDeck, createDeck, renameDeck, deleteDeck,
    getCardIds, getCards, getCard, hasCard, cardCount, getCardDeckIds,
    createCard, updateCard, setCardDecks, addCardToDeck, removeCardFromDeck, deleteCard,
    setReview, resetProgress, createSampleDeck, load, save, toSnapshot, restore,
  };
})();

// =============================================================================
// AppState: what the user is working on while screens change. Remembered in
// this browser only as a convenience.
// =============================================================================

const AppState = (() => {
  const state = { selected_deck_id: DataManager.ALL_CARDS, editing_card_id: -1, review_minutes: 0 };
  try {
    const saved = JSON.parse(localStorage.getItem('flashcards:app_state') || '{}');
    if (Number.isInteger(saved.selected_deck_id)) state.selected_deck_id = saved.selected_deck_id;
    if (Number.isInteger(saved.review_minutes)) state.review_minutes = saved.review_minutes;
  } catch (error) { /* no saved state */ }
  return new Proxy(state, {
    set(target, key, value) {
      target[key] = value;
      try {
        localStorage.setItem('flashcards:app_state', JSON.stringify({
          selected_deck_id: target.selected_deck_id, review_minutes: target.review_minutes,
        }));
      } catch (error) { /* storage unavailable */ }
      return true;
    },
  });
})();

// =============================================================================
// Srs: the spaced-repetition rules. Every card has a level, starting at 0.
// "Got it!" moves a card up one level; "Didn't get it." sends it back to 0.
// Level 0 is always due. A card at level n >= 1 is due again phi^(n-1) days
// after it reached that level, rounded: 1, 2, 3, 4, 7, 11, 18, 29, 47, 76, ...
// =============================================================================

const Srs = (() => {
  const PHI = 1.618033988749895;
  const MAX_INTERVAL_DAYS = 1000000;
  let dayOverride = -1;

  // Today's date as a whole number of days, in the user's time zone.
  function today() {
    if (dayOverride >= 0) return dayOverride;
    const now = new Date();
    return Math.floor((now.getTime() - now.getTimezoneOffset() * 60000) / 86400000);
  }

  function intervalDays(level) {
    if (level <= 0) return 0;
    const days = Math.pow(PHI, level - 1);
    if (days >= MAX_INTERVAL_DAYS) return MAX_INTERVAL_DAYS;
    return Math.max(1, Math.round(days));
  }

  const isDue = (review, day) => review.level === 0 || review.due_day <= day;
  const countDue = (cardList, day) => cardList.filter(card => isDue(card.review, day)).length;
  // "Review later" is not offered on a first look, and only once per card per day.
  const canDefer = (review, day) => !review.is_new && review.deferred_day !== day;

  function afterGotIt(review, day) {
    const level = review.level + 1;
    return { ...review, level, is_new: false, due_day: day + intervalDays(level) };
  }
  const afterMissed = (review, day) => ({ ...review, level: 0, is_new: false, due_day: day });
  // A first look shows a new card without testing it. It stays at level 0.
  const afterFirstLook = afterMissed;
  const afterDeferred = (review, day) => ({ ...review, deferred_day: day });

  function describe(review, day) {
    if (review.is_new) return 'New';
    const level = review.level;
    if (level === 0) return 'Level 0';
    const days = review.due_day - day;
    if (days <= 0) return `Level ${level} · due`;
    if (days === 1) return `Level ${level} · due tomorrow`;
    return `Level ${level} · due in ${days} days`;
  }

  return {
    today, intervalDays, isDue, countDue, canDefer, afterGotIt, afterMissed, afterFirstLook, afterDeferred, describe,
    set dayOverride(day) { dayOverride = day; },
  };
})();

// =============================================================================
// ReviewSession: which card comes next during a review.
//  1. Levels with due cards are reviewed from the highest down to 0.
//  2. Each level is worked through in buckets of up to 7 shuffled cards.
//  3. "Got it!" moves a card up and out of this review; "Didn't get it."
//     sends it to level 0, so it comes back before the end.
//  4. At level 0, cards missed (or first looked) in one bucket lead the next.
//     After them come level 0 cards seen before, and only then new cards.
//  5. The review is complete only when level 0 is empty.
// With a time limit, each level gets 20% of the time left when it starts;
// the last level gets the rest.
// =============================================================================

class ReviewSession {
  static State = { REVIEWING: 'reviewing', COMPLETE: 'complete', OUT_OF_TIME: 'out_of_time' };
  static BUCKET_SIZE = 7;
  static LEVEL_TIME_SHARE = 0.2;

  constructor(scope, timeLimitMinutes = 0, clock = () => performance.now()) {
    this.state = ReviewSession.State.REVIEWING;
    this.level = -1;
    this.bucketNumber = 0;
    this.gotItCount = 0;
    this.missedCount = 0;
    this.firstLookCount = 0;
    this._scope = scope;
    this._timeLimitMsec = timeLimitMinutes * 60000;
    this._clock = clock;
    this._startedMsec = 0;
    this._levelDeadlineMsec = 0;
    this._bucket = [];
    this._bucketSize = 0;
    this._queue = [];
    this._carry = [];
  }

  start() {
    this._startedMsec = this._clock();
    const levels = this._dueLevels();
    if (levels.length === 0) {
      this.state = ReviewSession.State.COMPLETE;
      return;
    }
    this._enterLevel(Math.max(...levels));
    this._nextBucket();
  }

  // --- What to show
  currentCardId() { return this.state === ReviewSession.State.REVIEWING ? this._bucket[0] : -1; }
  currentCard() { return DataManager.getCard(this.currentCardId()); }
  isFirstLook() { return this.currentCard().review.is_new; }
  canReviewLater() { return Srs.canDefer(this.currentCard().review, Srs.today()); }
  positionInBucket() { return this._bucketSize - this._bucket.length + 1; }
  bucketSize() { return this._bucketSize; }
  cardsLeftInLevel() { return this._bucket.length + this._queue.length + this._carry.length; }
  isTimed() { return this._timeLimitMsec > 0; }
  timeLeftMsec() { return Math.max(0, this._startedMsec + this._timeLimitMsec - this._clock()); }
  levelTimeLeftMsec() { return Math.max(0, this._levelDeadlineMsec - this._clock()); }

  // --- Answers
  answer(gotIt) {
    if (this.state !== ReviewSession.State.REVIEWING) return;
    const cardId = this._bucket.shift();
    const review = DataManager.getCard(cardId).review;
    if (gotIt) {
      DataManager.setReview(cardId, Srs.afterGotIt(review, Srs.today()));
      this.gotItCount += 1;
    } else {
      DataManager.setReview(cardId, Srs.afterMissed(review, Srs.today()));
      this.missedCount += 1;
      // Missed above level 0, the card is found at level 0 when the review gets there.
      if (this.level === 0) this._carry.push(cardId);
    }
    this._advance();
  }

  firstLook() {
    if (this.state !== ReviewSession.State.REVIEWING) return;
    const cardId = this._bucket.shift();
    const review = DataManager.getCard(cardId).review;
    DataManager.setReview(cardId, Srs.afterFirstLook(review, Srs.today()));
    this.firstLookCount += 1;
    this._carry.push(cardId);
    this._advance();
  }

  // Moves the current card to a random later place among the cards left at
  // this level. It comes back straight away only if no other card is left.
  reviewLater() {
    if (this.state !== ReviewSession.State.REVIEWING) return;
    const cardId = this._bucket.shift();
    const review = DataManager.getCard(cardId).review;
    DataManager.setReview(cardId, Srs.afterDeferred(review, Srs.today()));
    const remaining = this._bucket.length + this._queue.length;
    const low = Math.min(1, remaining);
    const place = low + Math.floor(Math.random() * (remaining - low + 1));
    if (place <= this._bucket.length) this._bucket.splice(place, 0, cardId);
    else this._queue.splice(place - this._bucket.length, 0, cardId);
    this._advance();
  }

  // --- Moving through the review
  _advance() {
    if (this.isTimed() && this._clock() >= this._levelDeadlineMsec) {
      if (this.level === 0 || this.timeLeftMsec() === 0) {
        this.state = ReviewSession.State.OUT_OF_TIME;
        return;
      }
      // This level's share is used up. Its other cards stay due for next time.
      this._bucket = [];
      this._queue = [];
    }
    if (this._bucket.length === 0) this._nextBucket();
  }

  _nextBucket() {
    for (;;) {
      if (this.level === 0 && this._carry.length > 0) {
        this._shuffle(this._carry);
        this._queue = [...this._carry, ...this._queue];
        this._carry = [];
      }
      if (this._queue.length > 0) {
        this._bucket = this._queue.slice(0, ReviewSession.BUCKET_SIZE);
        this._queue = this._queue.slice(ReviewSession.BUCKET_SIZE);
        this._bucketSize = this._bucket.length;
        this.bucketNumber += 1;
        return;
      }
      const lower = this._dueLevels().filter(l => l < this.level);
      if (lower.length === 0) {
        this.state = ReviewSession.State.COMPLETE;
        return;
      }
      this._enterLevel(Math.max(...lower));
    }
  }

  _enterLevel(newLevel) {
    this.level = newLevel;
    this.bucketNumber = 0;
    this._carry = [];
    this._queue = [];
    const today = Srs.today();
    const newCards = [];
    for (const card of DataManager.getCards(this._scope)) {
      if (card.review.level === this.level && Srs.isDue(card.review, today)) {
        (card.review.is_new ? newCards : this._queue).push(card.id);
      }
    }
    // New cards wait behind cards already seen. Only level 0 has new cards.
    this._shuffle(this._queue);
    this._shuffle(newCards);
    this._queue.push(...newCards);

    if (this.isTimed()) {
      const isLast = this.level === 0 || this._dueLevels().every(l => l >= this.level);
      const share = isLast ? 1 : ReviewSession.LEVEL_TIME_SHARE;
      this._levelDeadlineMsec = this._clock() + Math.trunc(this.timeLeftMsec() * share);
    }
  }

  // The levels that have at least one due card in scope.
  _dueLevels() {
    const today = Srs.today();
    const levels = new Set();
    for (const card of DataManager.getCards(this._scope)) {
      if (Srs.isDue(card.review, today)) levels.add(card.review.level);
    }
    return [...levels];
  }

  // Fisher-Yates shuffle.
  _shuffle(list) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
  }
}

// =============================================================================
// Markdown: draws card text as HTML. Supported: headings, paragraphs, line
// breaks, bold, italic, strikethrough, inline code, code blocks, links,
// images, bullet and numbered lists (nested by indentation), block quotes,
// rules and tables. Every piece of the card's own text is escaped, so a card
// can never inject HTML; images refer only to stored media files.
// =============================================================================

const Markdown = (() => {
  const HEADING_SCALES = [2.0, 1.6, 1.35, 1.15, 1.0, 0.9];
  const ESCAPABLE = '\\`*_{}[]()#+-.!|~>';
  const heading = /^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/;
  const rule = /^\s{0,3}([-*_])(\s*\1){2,}\s*$/;
  const quote = /^\s{0,3}>\s?(.*)$/;
  const listItem = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/;
  const tableDivider = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
  const isBlank = line => line.trim() === '';

  function toHtml(text) {
    const out = [];
    blocks(String(text || '').replace(/\r\n/g, '\n').split('\n'), out);
    return out.join('');
  }

  function blocks(lines, out) {
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (isBlank(line)) { i++; continue; }
      let m;
      if (line.trim().startsWith('```')) {
        i = codeBlock(lines, i, out);
      } else if ((m = heading.exec(line))) {
        const level = m[1].length;
        out.push(`<div class="md-h" style="font-size:${HEADING_SCALES[level - 1]}em">${inline(m[2])}</div>`);
        i++;
      } else if (rule.test(line)) {
        out.push('<hr>');
        i++;
      } else if (quote.test(line)) {
        i = quoteBlock(lines, i, out);
      } else if (listItem.test(line)) {
        i = listBlock(lines, i, out);
      } else if (i + 1 < lines.length && line.includes('|') && tableDivider.test(lines[i + 1])) {
        i = tableBlock(lines, i, out);
      } else {
        i = paragraph(lines, i, out);
      }
    }
  }

  function startsBlock(lines, i) {
    const line = lines[i];
    return isBlank(line) || line.trim().startsWith('```') || heading.test(line) || rule.test(line)
      || quote.test(line) || listItem.test(line);
  }

  // Unlike standard markdown, each line break is kept: flashcards are often laid out line by line.
  function paragraph(lines, i, out) {
    const paragraphLines = [lines[i].trim()];
    i++;
    while (i < lines.length && !startsBlock(lines, i)) paragraphLines.push(lines[i++].trim());
    out.push(`<p>${inline(paragraphLines.join('\n')).replace(/\n/g, '<br>')}</p>`);
    return i;
  }

  function codeBlock(lines, i, out) {
    const code = [];
    i++;
    while (i < lines.length && !lines[i].trim().startsWith('```')) code.push(lines[i++]);
    out.push(`<pre>${escapeHtml(code.join('\n'))}</pre>`);
    return i + 1;
  }

  function quoteBlock(lines, i, out) {
    const inner = [];
    let m;
    while (i < lines.length && (m = quote.exec(lines[i]))) { inner.push(m[1]); i++; }
    const quoted = [];
    blocks(inner, quoted);
    out.push(`<blockquote>${quoted.join('')}</blockquote>`);
    return i;
  }

  // Lists nest by indentation; numbered lists are counted per level.
  function listBlock(lines, i, out) {
    const indents = [];
    const counters = [];
    const items = [];
    while (i < lines.length) {
      const m = listItem.exec(lines[i]);
      if (!m) {
        // An indented line that is not an item continues the previous item.
        if (lines[i].startsWith('  ') && !isBlank(lines[i]) && indents.length > 0) {
          items.push(`<div class="md-li" style="--depth:${indents.length}">${inline(lines[i].trim())}</div>`);
          i++;
          continue;
        }
        break;
      }
      const indent = m[1].replace(/\t/g, '    ').length;
      while (indents.length && indent < indents[indents.length - 1]) { indents.pop(); counters.pop(); }
      const numbered = /^\d/.test(m[2]);
      if (!indents.length || indent > indents[indents.length - 1]) {
        indents.push(indent);
        counters.push(numbered ? parseInt(m[2], 10) : 1);
      }
      let bullet = '•';
      if (numbered) bullet = `${counters[counters.length - 1]++}.`;
      items.push(`<div class="md-li" style="--depth:${indents.length - 1}">${bullet} ${inline(m[3])}</div>`);
      i++;
    }
    out.push(`<div class="md-list">${items.join('')}</div>`);
    return i;
  }

  function cells(line) {
    return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim());
  }

  function tableBlock(lines, i, out) {
    const header = cells(lines[i]);
    let html = '<table><thead><tr>' + header.map(cell => `<th>${inline(cell)}</th>`).join('') + '</tr></thead><tbody>';
    i += 2;
    while (i < lines.length && lines[i].includes('|')) {
      const row = cells(lines[i]);
      html += '<tr>' + header.map((_, column) => `<td>${inline(row[column] ?? '')}</td>`).join('') + '</tr>';
      i++;
    }
    out.push(html + '</tbody></table>');
    return i;
  }

  // Scans text one character at a time. Plain characters collect in `plain`;
  // a marker's contents are scanned the same way, so **bold *and italic*** works.
  function inline(text) {
    let out = '';
    let plain = '';
    const flush = () => { out += escapeHtml(plain); plain = ''; };
    let i = 0;
    while (i < text.length) {
      const c = text[i];
      const pair = text.substr(i, 2);

      if (c === '\\' && i + 1 < text.length && ESCAPABLE.includes(text[i + 1])) {
        plain += text[i + 1];
        i += 2;
        continue;
      }

      if (c === '`') {
        const end = text.indexOf('`', i + 1);
        if (end !== -1) {
          flush();
          out += `<code>${escapeHtml(text.slice(i + 1, end))}</code>`;
          i = end + 1;
          continue;
        }
      }

      if (pair === '![' || c === '[') {
        const link = linkAt(text, pair === '![' ? i + 1 : i);
        if (link) {
          flush();
          if (pair === '![') {
            out += `<img data-media="${escapeHtml(link.target)}" alt="${escapeHtml(link.label)}">`;
          } else if (/^(https?:|mailto:)/i.test(link.target)) {
            out += `<a href="${escapeHtml(link.target)}" target="_blank" rel="noopener noreferrer">${inline(link.label)}</a>`;
          } else {
            out += inline(link.label);
          }
          i = link.end;
          continue;
        }
      }

      if (pair === '**' || pair === '__' || pair === '~~') {
        let end = text.indexOf(pair, i + 2);
        // In a run like "***", the closing pair is the last two markers.
        while (end !== -1 && end + 2 < text.length && text[end + 2] === c) end++;
        if (end > i + 2) {
          flush();
          const tag = pair === '~~' ? 's' : 'b';
          out += `<${tag}>${inline(text.slice(i + 2, end))}</${tag}>`;
          i = end + 2;
          continue;
        }
      }

      if ((c === '*' || c === '_') && opensEmphasis(text, i)) {
        const end = closingEmphasis(text, i);
        if (end !== -1) {
          flush();
          out += `<i>${inline(text.slice(i + 1, end))}</i>`;
          i = end + 1;
          continue;
        }
      }

      plain += c;
      i++;
    }
    flush();
    return out;
  }

  const isWordChar = c => /[\p{L}\p{N}_]/u.test(c);

  // An underscore also needs a non-letter before it, so snake_case_words stay as they are.
  function opensEmphasis(text, i) {
    if (i + 1 >= text.length || text[i + 1] === ' ') return false;
    if (text[i] === '_' && i > 0 && isWordChar(text[i - 1])) return false;
    return true;
  }

  function closingEmphasis(text, start) {
    const marker = text[start];
    let j = start + 1;
    while (j < text.length) {
      if (text[j] === marker) {
        if (j + 1 < text.length && text[j + 1] === marker) { j += 2; continue; }
        let closes = text[j - 1] !== ' ';
        if (marker === '_' && j + 1 < text.length && isWordChar(text[j + 1])) closes = false;
        if (closes && j > start + 1) return j;
      }
      j++;
    }
    return -1;
  }

  // Parses "[label](target)" starting at the "[" at i.
  function linkAt(text, i) {
    let depth = 0;
    let j = i;
    while (j < text.length) {
      if (text[j] === '[') depth++;
      else if (text[j] === ']') { depth--; if (depth === 0) break; }
      j++;
    }
    if (j >= text.length - 1 || text[j + 1] !== '(') return null;
    const close = text.indexOf(')', j + 2);
    if (close === -1) return null;
    let target = text.slice(j + 2, close).trim();
    const titleStart = target.indexOf(' "');
    if (titleStart !== -1) target = target.slice(0, titleStart);
    return { label: text.slice(i + 1, j), target: target.replace(/^</, '').replace(/>$/, ''), end: close + 1 };
  }

  // A one-line preview of a side, as the card browser shows it.
  function summary(side) {
    const text = side.text.replace(/!\[[^\]]*\]\([^)]*\)/g, '[image]');
    let line = '';
    for (const candidate of text.split('\n')) {
      line = candidate.trim().replace(/^[#>\-*+ ]+/, '').trim();
      if (line) break;
    }
    if (side.audio.length) line = (line + ' [audio]').trim();
    return line;
  }

  return { toHtml, summary };
})();

// =============================================================================
// HtmlToMarkdown: converts the HTML Anki stores in fields into markdown.
// Only tags that change how text reads are converted; others are dropped,
// keeping their text.
// =============================================================================

const HtmlToMarkdown = (() => {
  const hidden = /<(style|script)\b[^>]*>[\s\S]*?<\/\1\s*>|<!--[\s\S]*?-->/gi;
  const token = /<(\/?)([a-zA-Z][a-zA-Z0-9]*)([^>]*)>|([^<]+)|</g;
  const src = /\bsrc\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/i;
  const numbered = /^(\d+)\.(\s)/;
  const markerEnd = /(^|\n) *(-|\d+\.) $/;
  const parser = new DOMParser();

  function decodeEntities(text) {
    text = text.replace(/&nbsp;/g, ' ');
    if (!text.includes('&')) return text;
    // A text-only document: nothing in it can run or load.
    const doc = parser.parseFromString(`<!doctype html><body><textarea>${text.replace(/</g, '&lt;')}</textarea>`, 'text/html');
    return doc.querySelector('textarea').value;
  }

  // storeImage(source) returns the stored media name, or '' if the image is missing.
  async function translate(html, storeImage) {
    html = html.replace(hidden, '');
    let out = '';
    const lists = [];
    for (const m of html.matchAll(token)) {
      if (m[4]) { out = appendText(out, m[4]); continue; }
      const tag = (m[2] || '').toLowerCase();
      const closing = m[1] === '/';
      switch (tag) {
        case 'br': out += '\n'; break;
        case 'div': case 'p': case 'tr': out = endLine(out); break;
        case 'b': case 'strong': out += '**'; break;
        case 'i': case 'em': out += '*'; break;
        case 's': case 'strike': case 'del': out += '~~'; break;
        case 'code': out += '`'; break;
        case 'h1': case 'h2': case 'h3': case 'h4': case 'h5': case 'h6':
          out = endLine(out);
          if (!closing) out += '#'.repeat(Number(tag[1])) + ' ';
          break;
        case 'hr': out = endLine(out) + '---\n'; break;
        case 'ul': case 'ol':
          out = endLine(out);
          if (closing) lists.pop();
          else lists.push({ ordered: tag === 'ol', count: 0 });
          break;
        case 'li':
          if (!closing && lists.length) {
            const list = lists[lists.length - 1];
            list.count++;
            const marker = list.ordered ? `${list.count}. ` : '- ';
            out = endLine(out) + '  '.repeat(lists.length - 1) + marker;
          }
          break;
        case 'td': case 'th':
          if (!closing && out && !out.endsWith('\n')) out += ' | ';
          break;
        case 'img':
          out += await image(m[3], storeImage);
          break;
      }
    }
    return tidy(out);
  }

  function appendText(out, text) {
    text = decodeEntities(text).replace(/\s+/g, ' ');
    if (!out || out.endsWith('\n') || markerEnd.test(out)) text = text.replace(/^ +/, '');
    let escaped = '';
    for (const c of text) escaped += ('\\`*_[]~'.includes(c) ? '\\' : '') + c;
    // Text at the start of a line that looks like a markdown marker is escaped.
    if (!out || out.endsWith('\n')) {
      if (escaped && '#>-+'.includes(escaped[0])) escaped = '\\' + escaped;
      escaped = escaped.replace(numbered, '$1\\.$2');
    }
    return out + escaped;
  }

  function endLine(out) {
    out = out.replace(/ +$/, '');
    return !out || out.endsWith('\n') ? out : out + '\n';
  }

  async function image(attributes, storeImage) {
    const m = src.exec(attributes);
    if (!m) return '';
    const source = decodeEntities(m[1] ?? m[2] ?? m[3] ?? '');
    const stored = await storeImage(source);
    if (stored) return `![](${stored})`;
    // A missing image keeps its original name, which the card shows as a placeholder.
    let decoded = source;
    try { decoded = decodeURIComponent(source); } catch (error) { /* keep as is */ }
    return `![${decoded}](${decoded.replace(/\)/g, '%29')})`;
  }

  function tidy(out) {
    let text = out.split('\n').map(line => line.replace(/ +$/, '')).join('\n');
    while (text.includes('\n\n\n')) text = text.replace(/\n\n\n/g, '\n\n');
    return text.trim();
  }

  return { translate };
})();

// =============================================================================
// Anki file formats, read with typed arrays: ZIP, Zstandard, SQLite and
// Protocol Buffers.
// =============================================================================

// --- ZIP --------------------------------------------------------------------------

async function readZip(bytes) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let end = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
    if (view.getUint32(i, true) === 0x06054b50) { end = i; break; }
  }
  if (end === -1) throw new Error('not a zip archive');
  let count = view.getUint16(end + 10, true);
  let directory = view.getUint32(end + 16, true);
  // ZIP64 archives keep the real values in a second record.
  if (directory === 0xFFFFFFFF && end >= 20 && view.getUint32(end - 20, true) === 0x07064b50) {
    const record = Number(view.getBigUint64(end - 12, true));
    count = Number(view.getBigUint64(record + 32, true));
    directory = Number(view.getBigUint64(record + 48, true));
  }

  const entries = new Map();
  let p = directory;
  for (let n = 0; n < count && view.getUint32(p, true) === 0x02014b50; n++) {
    const method = view.getUint16(p + 10, true);
    let compressedSize = view.getUint32(p + 20, true);
    let size = view.getUint32(p + 24, true);
    const nameLength = view.getUint16(p + 28, true);
    const extraLength = view.getUint16(p + 30, true);
    const commentLength = view.getUint16(p + 32, true);
    let local = view.getUint32(p + 42, true);
    const name = utf8.decode(bytes.subarray(p + 46, p + 46 + nameLength));
    // ZIP64 extra field: the sizes and offset that did not fit, in this order.
    let extra = p + 46 + nameLength;
    const extraEnd = extra + extraLength;
    while (extra + 4 <= extraEnd) {
      const id = view.getUint16(extra, true);
      const length = view.getUint16(extra + 2, true);
      if (id === 1) {
        let q = extra + 4;
        if (size === 0xFFFFFFFF) { size = Number(view.getBigUint64(q, true)); q += 8; }
        if (compressedSize === 0xFFFFFFFF) { compressedSize = Number(view.getBigUint64(q, true)); q += 8; }
        if (local === 0xFFFFFFFF) { local = Number(view.getBigUint64(q, true)); }
      }
      extra += 4 + length;
    }
    entries.set(name, { method, compressedSize, size, local });
    p = extraEnd + commentLength;
  }

  return {
    files: [...entries.keys()],
    has: name => entries.has(name),
    async read(name) {
      const entry = entries.get(name);
      if (!entry) return null;
      const start = entry.local + 30 + view.getUint16(entry.local + 26, true) + view.getUint16(entry.local + 28, true);
      const data = bytes.subarray(start, start + entry.compressedSize);
      if (entry.method === 0) return data.slice();
      if (entry.method === 8) return inflateRaw(data);
      throw new Error(`unsupported compression method ${entry.method} for ${name}`);
    },
  };
}

async function inflateRaw(data) {
  const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

// --- Zstandard ---------------------------------------------------------------------

// Zstandard data starts with these four bytes.
const isZstd = bytes => bytes && bytes.length >= 4 && bytes[0] === 0x28 && bytes[1] === 0xB5 && bytes[2] === 0x2F && bytes[3] === 0xFD;

function decompressZstd(bytes) {
  if (!globalThis.fzstd) throw new Error('Zstandard support is missing');
  return fzstd.decompress(bytes);
}

// --- Protocol Buffers ---------------------------------------------------------------

// Reads a message into field number -> list of values. Numbers come back as
// numbers; strings, bytes and nested messages as Uint8Array.
function readProtobuf(bytes) {
  const fields = new Map();
  let position = 0;
  while (position < bytes.length) {
    const [key, afterKey] = leb128(bytes, position);
    position = afterKey;
    let value;
    const wireType = key % 8;
    if (wireType === 0) {
      [value, position] = leb128(bytes, position);
    } else if (wireType === 1) {
      value = bytes.subarray(position, position + 8); position += 8;
    } else if (wireType === 2) {
      const [length, start] = leb128(bytes, position);
      value = bytes.subarray(start, start + length);
      position = start + length;
    } else if (wireType === 5) {
      value = bytes.subarray(position, position + 4); position += 4;
    } else {
      break; // Unknown wire type; stop rather than misread.
    }
    const number = Math.floor(key / 8);
    if (!fields.has(number)) fields.set(number, []);
    fields.get(number).push(value);
  }
  return fields;
}

// A Protocol Buffers varint: 7 bits per byte, lowest bits first.
function leb128(bytes, offset) {
  let value = 0;
  let scale = 1;
  while (offset < bytes.length) {
    const byte = bytes[offset++];
    value += (byte & 0x7F) * scale;
    if (byte < 0x80) break;
    scale *= 128;
  }
  return [value, offset];
}

// --- SQLite -------------------------------------------------------------------------
// An SQLite file is a sequence of equal-sized pages. Each table is a B-tree:
// interior pages point to child pages, leaf pages hold rows. A row is a
// "record": a header listing each value's type, then the values. Numbers are
// big-endian, and many are "varints" of 1 to 9 bytes.

class SQLiteReader {
  static TABLE_INTERIOR = 0x05;
  static TABLE_LEAF = 0x0D;
  static INDEX_INTERIOR = 0x02;
  static INDEX_LEAF = 0x0A;

  // Returns true if the bytes are a UTF-8 SQLite database.
  open(data) {
    if (data.length < 100 || String.fromCharCode(...data.subarray(0, 15)) !== 'SQLite format 3') return false;
    this.data = data;
    this.view = new DataView(data.buffer, data.byteOffset, data.byteLength);
    this.pageSize = this.uint(16, 2);
    if (this.pageSize === 1) this.pageSize = 65536;
    this.usable = this.pageSize - data[20];
    if (this.uint(56, 4) !== 1) return false; // Text is UTF-16; Anki always uses UTF-8.
    this.readSchema();
    return true;
  }

  hasTable(table) { return this.tables.has(table); }

  // Every row of a table as an object of column name -> value.
  rows(table) {
    const info = this.tables.get(table);
    if (!info) return [];
    const entries = [];
    this.collect(info.root, entries);
    return entries.map(([rowid, payload]) => {
      const values = this.record(payload);
      const row = {};
      info.columns.forEach((column, i) => { row[column] = i < values.length ? values[i] : null; });
      // INTEGER PRIMARY KEY columns are stored as the row's key, not in the record.
      if (info.rowidColumn !== -1) row[info.columns[info.rowidColumn]] = rowid;
      return row;
    });
  }

  readSchema() {
    this.tables = new Map();
    const entries = [];
    this.collect(1, entries);
    for (const [, payload] of entries) {
      const [type, name, , rootPage, sql] = this.record(payload);
      if (type === 'table' && typeof rootPage === 'number' && rootPage > 0 && typeof sql === 'string') {
        this.tables.set(name, { ...this.parseColumns(sql), root: rootPage });
      }
    }
  }

  // Reads column names from a CREATE TABLE statement.
  parseColumns(sql) {
    sql = sql.replace(/\/\*[\s\S]*?\*\/|--[^\n]*/g, '');
    const body = sql.slice(sql.indexOf('(') + 1, sql.lastIndexOf(')'));
    let columns = [];
    const primaryKey = [];
    let rowidColumn = -1;
    const unquote = id => id.trim().replace(/^["`[]/, '').replace(/["`\]]$/, '');
    for (const part of splitTopLevel(body)) {
      const definition = part.trim();
      const lower = definition.toLowerCase();
      if (!definition) continue;
      if (lower.startsWith('primary key')) {
        const names = lower.slice(lower.indexOf('(') + 1, lower.indexOf(')'));
        for (const columnName of names.split(',')) primaryKey.push(unquote(columnName.trim().split(/\s+/)[0]));
        continue;
      }
      if (/^(unique|check|foreign|constraint)\b/.test(lower)) continue;
      const words = definition.split(/\s+/);
      columns.push(unquote(words[0]));
      if (lower.includes('primary key')) {
        if (words.length > 1 && words[1].toLowerCase() === 'integer') rowidColumn = columns.length - 1;
        else primaryKey.push(columns[columns.length - 1]);
      }
    }
    // A WITHOUT ROWID table stores its primary key columns first.
    if (/without\s+rowid\s*;?\s*$/i.test(sql.trim())) {
      rowidColumn = -1;
      const ordered = [...primaryKey];
      for (const columnName of columns) if (!ordered.includes(columnName)) ordered.push(columnName);
      columns = ordered;
    }
    return { columns, rowidColumn };

    function splitTopLevel(text) {
      const parts = [];
      let depth = 0;
      let start = 0;
      for (let i = 0; i < text.length; i++) {
        if (text[i] === '(') depth++;
        else if (text[i] === ')') depth--;
        else if (text[i] === ',' && depth === 0) { parts.push(text.slice(start, i)); start = i + 1; }
      }
      parts.push(text.slice(start));
      return parts;
    }
  }

  // Appends [rowid, payload] for every entry of the B-tree rooted at page, in key order.
  collect(page, out) {
    const pageStart = (page - 1) * this.pageSize;
    const header = pageStart + (page === 1 ? 100 : 0); // Page 1 begins with the file header.
    const kind = this.data[header];
    const isLeaf = kind === SQLiteReader.TABLE_LEAF || kind === SQLiteReader.INDEX_LEAF;
    const cellCount = this.uint(header + 3, 2);
    const pointers = header + (isLeaf ? 8 : 12);
    for (let i = 0; i < cellCount; i++) {
      const cell = pageStart + this.uint(pointers + i * 2, 2);
      if (kind === SQLiteReader.TABLE_LEAF) {
        const [size, afterSize] = SQLiteReader.varint(this.data, cell);
        const [rowid, afterRowid] = SQLiteReader.varint(this.data, afterSize);
        out.push([rowid, this.payload(afterRowid, size, false)]);
      } else if (kind === SQLiteReader.TABLE_INTERIOR) {
        this.collect(this.uint(cell, 4), out);
      } else if (kind === SQLiteReader.INDEX_LEAF) {
        const [size, afterSize] = SQLiteReader.varint(this.data, cell);
        out.push([0, this.payload(afterSize, size, true)]);
      } else if (kind === SQLiteReader.INDEX_INTERIOR) {
        this.collect(this.uint(cell, 4), out);
        // In an index B-tree, interior cells hold entries too.
        const [size, afterSize] = SQLiteReader.varint(this.data, cell + 4);
        out.push([0, this.payload(afterSize, size, true)]);
      }
    }
    if (!isLeaf) this.collect(this.uint(header + 8, 4), out); // The right-most child.
  }

  // A payload too big for its page continues on a chain of overflow pages.
  payload(start, size, isIndex) {
    const usable = this.usable;
    const maxLocal = isIndex ? Math.floor((usable - 12) * 64 / 255) - 23 : usable - 35;
    if (size <= maxLocal) return this.data.subarray(start, start + size);
    const minLocal = Math.floor((usable - 12) * 32 / 255) - 23;
    let local = minLocal + (size - minLocal) % (usable - 4);
    if (local > maxLocal) local = minLocal;
    const result = new Uint8Array(size);
    result.set(this.data.subarray(start, start + local));
    let filled = local;
    let next = this.uint(start + local, 4);
    while (filled < size && next !== 0) {
      const pageStart = (next - 1) * this.pageSize;
      next = this.uint(pageStart, 4);
      const take = Math.min(usable - 4, size - filled);
      result.set(this.data.subarray(pageStart + 4, pageStart + 4 + take), filled);
      filled += take;
    }
    return result;
  }

  // Decodes a record into its values.
  record(payload) {
    const view = new DataView(payload.buffer, payload.byteOffset, payload.byteLength);
    const [headerSize, afterHeaderSize] = SQLiteReader.varint(payload, 0);
    let position = afterHeaderSize;
    const types = [];
    while (position < headerSize) {
      const [serial, next] = SQLiteReader.varint(payload, position);
      types.push(serial);
      position = next;
    }
    const values = [];
    let body = headerSize;
    for (const type of types) {
      if (type === 0) {
        values.push(null);
      } else if (type >= 1 && type <= 6) {
        const size = [1, 2, 3, 4, 6, 8][type - 1];
        if (size === 8) {
          values.push(Number(view.getBigInt64(body)));
        } else {
          let value = 0;
          for (let i = 0; i < size; i++) value = value * 256 + payload[body + i];
          if (value >= 2 ** (size * 8 - 1)) value -= 2 ** (size * 8);
          values.push(value);
        }
        body += size;
      } else if (type === 7) {
        values.push(view.getFloat64(body));
        body += 8;
      } else if (type === 8 || type === 9) {
        values.push(type - 8);
      } else {
        const size = type % 2 === 0 ? (type - 12) / 2 : (type - 13) / 2;
        const bytes = payload.subarray(body, body + size);
        values.push(type % 2 === 0 ? bytes : utf8.decode(bytes));
        body += size;
      }
    }
    return values;
  }

  // An unsigned big-endian integer from the file.
  uint(offset, size) {
    let value = 0;
    for (let i = 0; i < size; i++) value = value * 256 + this.data[offset + i];
    return value;
  }

  // Each of the first eight bytes gives 7 bits, high bit meaning "more follows";
  // a ninth byte gives a full 8 bits.
  static varint(bytes, offset) {
    let value = 0;
    for (let i = 0; i < 8; i++) {
      const byte = bytes[offset + i];
      value = value * 128 + (byte & 0x7F);
      if (byte < 0x80) return [value, offset + i + 1];
    }
    return [value * 256 + bytes[offset + 8], offset + 9];
  }
}

// =============================================================================
// AnkiImporter: imports an .apkg package. Anki keeps "notes" (the fields)
// separately from "cards" (what is studied); a card is a note type's template
// filled with a note's fields. This importer does the same, then converts the
// HTML to markdown. Imported cards are new; Anki's scheduling is not imported.
// =============================================================================

class AnkiImporter {
  static sound = /\[sound:([^\]]+)\]/g;
  static cloze = /\{\{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g;
  // The innermost conditional section: {{#Field}}...{{/Field}} or {{^Field}}...{{/Field}}.
  static section = /\{\{([#^])\s*([^}]+?)\s*\}\}((?:(?!\{\{[#^])[\s\S])*?)\{\{\/\s*\2\s*\}\}/;
  static replacement = /\{\{([^{}]+?)\}\}/g;
  static answerRule = /<hr[^>]*id\s*=\s*["']?answer["']?[^>]*>/gi;
  static tags = /<[^>]*>/g;

  constructor() {
    this.mediaEntries = new Map(); // original media name -> archive entry name
    this.storedMedia = new Map();  // original media name -> stored name ('' if missing)
    this.missingMedia = 0;
  }

  // Returns { message, deckIds }.
  async importPackage(bytes, fileName) {
    try {
      this.zip = await readZip(bytes);
    } catch (error) {
      return AnkiImporter.result(`Could not open ${fileName}. Is it an Anki deck package (.apkg)?`);
    }
    let database = null;
    try {
      if (this.zip.has('collection.anki21b')) database = decompressZstd(await this.zip.read('collection.anki21b'));
      else if (this.zip.has('collection.anki21')) database = await this.zip.read('collection.anki21');
      else if (this.zip.has('collection.anki2')) database = await this.zip.read('collection.anki2');
    } catch (error) {
      console.error(error);
      database = null;
    }
    const db = new SQLiteReader();
    if (!database || !db.open(database)) {
      return AnkiImporter.result(`${fileName} does not contain an Anki collection this app can read.`);
    }
    await this.readMediaMap();
    return this.importCards(db);
  }

  // note type id -> { cloze, fields: [names], templates: [{ front, back }] }
  readNoteTypes(db) {
    const types = new Map();
    const text = bytes => (bytes ? utf8.decode(bytes) : '');
    if (db.hasTable('notetypes')) {
      // Newer collections: one table each for note types, fields and templates.
      for (const row of db.rows('notetypes')) {
        const config = readProtobuf(row.config || new Uint8Array());
        types.set(row.id, { cloze: (config.get(1) || [0])[0] === 1, fields: [], templates: [] });
      }
      for (const row of AnkiImporter.sorted(db.rows('fields'), 'ord')) {
        if (types.has(row.ntid)) types.get(row.ntid).fields.push(row.name);
      }
      for (const row of AnkiImporter.sorted(db.rows('templates'), 'ord')) {
        if (!types.has(row.ntid)) continue;
        const config = readProtobuf(row.config || new Uint8Array());
        types.get(row.ntid).templates.push({ front: text((config.get(1) || [])[0]), back: text((config.get(2) || [])[0]) });
      }
    } else {
      // Older collections: all note types as JSON in the single row of "col".
      const models = JSON.parse(db.rows('col')[0].models);
      for (const model of Object.values(models)) {
        types.set(Number(model.id), {
          cloze: Number(model.type || 0) === 1,
          fields: AnkiImporter.sorted(model.flds, 'ord').map(field => field.name),
          templates: AnkiImporter.sorted(model.tmpls, 'ord').map(t => ({ front: t.qfmt, back: t.afmt })),
        });
      }
    }
    return types;
  }

  // Anki deck id -> name, with "::" between levels, as Anki shows it.
  readDecks(db) {
    const decks = new Map();
    if (db.hasTable('decks')) {
      for (const row of db.rows('decks')) decks.set(row.id, String(row.name).replace(/\u001f/g, '::'));
    } else {
      const json = JSON.parse(db.rows('col')[0].decks);
      for (const deck of Object.values(json)) decks.set(Number(deck.id), deck.name);
    }
    return decks;
  }

  async importCards(db) {
    const noteTypes = this.readNoteTypes(db);
    const ankiDecks = this.readDecks(db);
    const notes = new Map();
    for (const row of db.rows('notes')) notes.set(row.id, { type: row.mid, fields: String(row.flds).split('\u001f') });

    // Cards already in the collection, by content, so importing twice adds nothing.
    const existing = new Map();
    for (const card of DataManager.getCards()) existing.set(AnkiImporter.contentKey(card.front, card.back), card.id);

    const deckIds = new Map(); // Anki deck id -> this app's deck id
    let imported = 0;
    let duplicates = 0;
    let skipped = 0;
    DataManager.beginBatch();
    try {
      for (const row of db.rows('cards')) {
        const note = notes.get(row.nid);
        const noteType = note && noteTypes.get(note.type);
        if (!noteType) { skipped++; continue; }
        const templateIndex = noteType.cloze ? 0 : row.ord;
        if (templateIndex >= noteType.templates.length) { skipped++; continue; }
        const template = noteType.templates[templateIndex];
        const fields = new Map();
        noteType.fields.forEach((name, i) => fields.set(name, i < note.fields.length ? note.fields[i] : ''));

        const clozeNumber = row.ord + 1;
        const front = await this.makeSide(this.render(template.front, fields, clozeNumber, false));
        const back = await this.makeSide(this.render(template.back, fields, clozeNumber, true));
        if (!front.text && !front.audio.length) { skipped++; continue; }

        // A card in a filtered deck remembers its home deck in "odid".
        const ankiDeck = row.odid ? row.odid : row.did;
        if (!deckIds.has(ankiDeck)) {
          const deckName = ankiDecks.get(ankiDeck) || 'Imported';
          const found = DataManager.findDeck(deckName);
          deckIds.set(ankiDeck, found !== -1 ? found : DataManager.createDeck(deckName));
        }
        const deckId = deckIds.get(ankiDeck);

        const key = AnkiImporter.contentKey(front, back);
        if (existing.has(key)) {
          DataManager.addCardToDeck(deckId, existing.get(key));
          duplicates++;
        } else {
          existing.set(key, DataManager.createCard(front, back, [deckId]));
          imported++;
        }
      }
    } finally {
      DataManager.endBatch();
    }

    const lines = [`Imported ${plural(imported, 'new card')} into ${plural(deckIds.size, 'deck')}.`];
    if (duplicates > 0) lines.push(`${plural(duplicates, 'card was', 'cards were')} already in your collection; added to the deck instead of copied.`);
    if (skipped > 0) lines.push(`${plural(skipped, 'card')} skipped because their front would be empty.`);
    if (this.missingMedia > 0) lines.push(`${plural(this.missingMedia, 'media file was', 'media files were')} missing from the package.`);
    return AnkiImporter.result(lines.join('\n'), [...deckIds.values()]);
  }

  // --- Templates: HTML with {{Field}} replacements, {{#Field}}...{{/Field}}
  // sections shown only when a field has content ({{^Field}} for the reverse),
  // and filters before the field name, as in {{cloze:Text}}.

  render(template, fields, clozeNumber, isAnswer) {
    // The answer side in Anki repeats the question above a rule. Here the two
    // sides are shown separately, so the repeated question is removed.
    template = template.split('{{FrontSide}}').join('').replace(AnkiImporter.answerRule, '');
    for (;;) {
      const m = AnkiImporter.section.exec(template);
      if (!m) break;
      const hasContent = AnkiImporter.stripHtml(AnkiImporter.field(fields, m[2])) !== '';
      const keep = m[1] === '#' ? hasContent : !hasContent;
      template = template.slice(0, m.index) + (keep ? m[3] : '') + template.slice(m.index + m[0].length);
    }
    return template.replace(AnkiImporter.replacement, (_, tag) => AnkiImporter.replacementValue(tag, fields, clozeNumber, isAnswer));
  }

  static replacementValue(tag, fields, clozeNumber, isAnswer) {
    const parts = tag.split(':');
    let value = AnkiImporter.field(fields, parts[parts.length - 1]);
    // Filters apply from the one nearest the field name outwards.
    for (let i = parts.length - 2; i >= 0; i--) {
      const filter = parts[i].trim().toLowerCase();
      if (filter === 'cloze') value = AnkiImporter.renderCloze(value, clozeNumber, isAnswer);
      else if (filter === 'text') value = AnkiImporter.stripHtml(value);
      else if (filter === 'type' || filter.startsWith('tts')) value = ''; // Typing answers and text-to-speech are not supported.
    }
    return value;
  }

  static field(fields, fieldName) {
    fieldName = fieldName.trim();
    if (fields.has(fieldName)) return fields.get(fieldName);
    for (const [key, value] of fields) if (key.toLowerCase() === fieldName.toLowerCase()) return value;
    return '';
  }

  // The card's own deletion is hidden as [...] (or its hint) on the question
  // side and shown in bold on the answer side. Other deletions show their text.
  static renderCloze(text, clozeNumber, isAnswer) {
    return text.replace(AnkiImporter.cloze, (_, number, answer, hint) => {
      if (Number(number) !== clozeNumber) return answer;
      if (isAnswer) return `<b>${answer}</b>`;
      return `<b>[${hint ? hint : '...'}]</b>`;
    });
  }

  static stripHtml(html) {
    return html.replace(AnkiImporter.tags, '').replace(/&nbsp;/g, ' ').trim();
  }

  // --- Sides and media

  async makeSide(html) {
    const audio = [];
    for (const m of html.matchAll(AnkiImporter.sound)) {
      const stored = await this.storeMedia(m[1]);
      if (stored) audio.push(stored);
    }
    html = html.replace(AnkiImporter.sound, '');
    return DataManager.makeSide(await HtmlToMarkdown.translate(html, name => this.storeMedia(name)), audio);
  }

  // Copies a media file from the package into the media store, once.
  async storeMedia(originalName) {
    if (this.storedMedia.has(originalName)) return this.storedMedia.get(originalName);
    let decoded = originalName;
    try { decoded = decodeURIComponent(originalName); } catch (error) { /* keep as is */ }
    const entry = this.mediaEntries.get(originalName) ?? this.mediaEntries.get(decoded) ?? '';
    let stored = '';
    if (entry) {
      try {
        let bytes = await this.zip.read(entry);
        if (isZstd(bytes)) bytes = decompressZstd(bytes);
        // The media list can name an entry the archive does not hold.
        if (bytes && bytes.length) stored = await Media.storeBytes(bytes, fileExtension(originalName));
      } catch (error) {
        console.error(error);
      }
    }
    if (!stored) this.missingMedia++;
    this.storedMedia.set(originalName, stored);
    return stored;
  }

  async readMediaMap() {
    this.mediaEntries.clear();
    if (!this.zip.has('media')) return;
    const bytes = await this.zip.read('media');
    if (isZstd(bytes)) {
      // MediaEntries { repeated MediaEntry entries = 1; }
      // MediaEntry { string name = 1; ...; optional uint32 legacy_zip_filename = 255; }
      const entries = readProtobuf(decompressZstd(bytes)).get(1) || [];
      entries.forEach((message, index) => {
        const entry = readProtobuf(message);
        const zipName = entry.has(255) ? String(entry.get(255)[0]) : String(index);
        this.mediaEntries.set(utf8.decode(entry.get(1)[0]), zipName);
      });
    } else {
      try {
        const json = JSON.parse(utf8.decode(bytes));
        for (const [zipName, name] of Object.entries(json)) this.mediaEntries.set(name, zipName);
      } catch (error) { /* no usable media map */ }
    }
  }

  static sorted(rows, key) { return [...rows].sort((a, b) => a[key] - b[key]); }
  static contentKey(front, back) { return JSON.stringify([{ text: front.text, audio: front.audio }, { text: back.text, audio: back.audio }]); }
  static result(message, deckIds = []) { return { message, deckIds }; }
}

// Opens a modal dialog. Resolves with true when OK is chosen, false otherwise.
// onOk may return false to keep the dialog open.
function openDialog({ title, body = [], okText = 'OK', cancelText = 'Cancel', width = 420, onOk = null, focus = null, danger = false }) {
  return new Promise(resolve => {
    const ok = $('button', { type: 'submit', style: danger ? 'color: var(--danger)' : '' }, okText);
    const cancel = cancelText ? $('button', { type: 'button' }, cancelText) : null;
    const form = $('form', { method: 'dialog', style: 'display:contents' },
      $('div', { class: 'dialog-title' }, title),
      $('div', { class: 'dialog-body' }, body),
      $('div', { class: 'dialog-buttons' }, cancel, ok));
    const dialog = $('dialog', { style: `--dialog-width: ${width}px` }, form);
    let result = false;
    form.addEventListener('submit', event => {
      if (onOk && onOk() === false) { event.preventDefault(); return; }
      result = true;
    });
    if (cancel) cancel.addEventListener('click', () => dialog.close());
    dialog.addEventListener('close', () => { dialog.remove(); resolve(result); });
    document.body.append(dialog);
    dialog.showModal();
    (focus || ok).focus();
    if (focus && focus.select) focus.select();
  });
}

const confirmDialog = (title, text, okText, options = {}) =>
  openDialog({ title, body: $('p', {}, text), okText, ...options });

async function promptDialog(title, value, okText, placeholder) {
  const input = $('input', { type: 'text', value, placeholder, maxLength: 200 });
  const ok = await openDialog({ title, body: input, okText, focus: input, width: 360 });
  return ok ? input.value.trim() : null;
}

const player = new Audio();

function createCardView({ textSize = 16, centered = false } = {}) {
  const md = $('div', { class: 'md', style: `font-size:${textSize}px` });
  const audioRow = $('div', { class: 'audio-row', hidden: true });
  const el = $('div', { class: 'card-view' + (centered ? ' centered' : '') }, md, audioRow);

  function showSide(side) {
    md.classList.remove('message');
    md.innerHTML = Markdown.toHtml(side.text);
    Media.hydrate(md);
    buildAudioButtons(side.audio);
  }

  function showMessage(message) {
    md.classList.add('message');
    md.textContent = message;
    buildAudioButtons([]);
  }

  function buildAudioButtons(clips) {
    player.pause();
    audioRow.replaceChildren();
    audioRow.hidden = clips.length === 0;
    clips.forEach((clip, index) => {
      const button = $('button', { type: 'button', disabled: true }, clips.length === 1 ? 'Play audio' : `Play audio ${index + 1}`);
      audioRow.append(button);
      Media.audioUrl(clip).then(src => {
        if (!src) {
          button.title = `This sound cannot be played: ${clip}`;
          return;
        }
        button.disabled = false;
        button.addEventListener('click', () => { player.src = src; player.currentTime = 0; player.play().catch(() => {}); });
      });
    });
  }

  return { el, showSide, showMessage };
}

// Screens. Exactly one is shown at a time; changing screens replaces it, and

const app = document.getElementById('app');

  player.pause();
  app.replaceChildren();

const Screens = {};

// --- Main menu: choose which cards to work with, then browse or review them.

Screens.mainMenu = () => {
  const deckPicker = $('select', { 'aria-label': 'Cards from', onchange: updateForSelection });
  const countLabel = $('div', { class: 'muted' });
  const reviewButton = $('button', { onclick: () => changeScreen('review') }, 'Review');
  const timeLimit = $('input', {
    type: 'number', min: 0, max: 240, step: 1, value: AppState.review_minutes, 'aria-label': 'Time limit in minutes',
    onchange: () => {
      const minutes = Math.max(0, Math.min(240, Math.trunc(Number(timeLimit.value) || 0)));
