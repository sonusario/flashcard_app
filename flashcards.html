      AppState.review_minutes = minutes;
    },
  });
  const importInput = $('input', { type: 'file', accept: '.apkg', hidden: true, onchange: () => onImportFileSelected(importInput) });
  const restoreInput = $('input', { type: 'file', accept: '.json,application/json', hidden: true, onchange: () => onRestoreSelected(restoreInput) });

  const el = $('div', { class: 'center' },
    $('div', { class: 'menu' },
      $('h1', {}, 'Flashcards'),
      $('label', {}, 'Cards from'),
      deckPicker,
      countLabel,
      $('div', { class: 'row equal' }, $('button', { onclick: () => changeScreen('cardBrowser') }, 'Browse Cards'), reviewButton),
      $('div', { class: 'row time-row' }, $('span', { class: 'grow' }, 'Time limit (0 = none)'), timeLimit, $('span', {}, 'min')),
      $('hr'),
      $('button', { onclick: onNewDeckPressed }, 'New Deck'),
      $('button', { onclick: () => importInput.click() }, 'Import Anki Deck…'),
      $('div', { class: 'row equal' },
        $('button', { onclick: onBackUpPressed, title: 'Download every card, deck, image and sound as one file' }, 'Back Up…'),
        $('button', { onclick: () => restoreInput.click(), title: 'Replace everything with a backup file' }, 'Restore…')),
      Storage.persistent ? null : $('div', { class: 'muted small' }, 'This browser does not allow saving here, so changes last only until the page is closed. Use Back Up to keep them.'),
      importInput, restoreInput));

  // Rebuilds the list of scopes and keeps the remembered one selected.
  function refresh() {
    deckPicker.replaceChildren($('option', { value: DataManager.ALL_CARDS }, 'All Cards'));
    const decks = DataManager.getDecks();
    if (decks.length) deckPicker.append($('option', { disabled: true }, '──────────'));
    for (const deck of decks) deckPicker.append($('option', { value: deck.id }, deck.name));
    const remembered = AppState.selected_deck_id;
    deckPicker.value = DataManager.hasDeck(remembered) ? String(remembered) : String(DataManager.ALL_CARDS);
    updateForSelection();
  }

  // Remembers the selected scope and enables only the buttons that make sense.
  function updateForSelection() {
    const scope = Number(deckPicker.value);
    AppState.selected_deck_id = scope;
    const count = DataManager.cardCount(scope);
    const due = Srs.countDue(DataManager.getCards(scope), Srs.today());
    reviewButton.disabled = due === 0;
    countLabel.textContent = `${plural(count, 'card')} · ${due} due`;
  }

  // Creates the deck, then opens it so that cards can be added straight away.
  async function onNewDeckPressed() {
    const deckName = await promptDialog('New Deck', '', 'Create', 'Deck name');
    if (!deckName) return;
    const existing = DataManager.findDeck(deckName);
    AppState.selected_deck_id = existing !== -1 ? existing : DataManager.createDeck(deckName);
    changeScreen('cardBrowser');
  }

  async function onImportFileSelected(input) {
    const file = input.files[0];
    input.value = '';
    if (!file) return;
    countLabel.textContent = `Importing ${file.name}…`;
    const done = showBusy(`Importing ${file.name}…`);
    await nextFrame();
    let result;
    try {
      result = await new AnkiImporter().importPackage(new Uint8Array(await file.arrayBuffer()), file.name);
    } catch (error) {
      console.error(error);
      result = AnkiImporter.result(`Could not import ${file.name}: ${error.message || error}`);
    } finally {
      done();
    }
    if (result.deckIds.length === 1) AppState.selected_deck_id = result.deckIds[0];
    refresh();
    showImportResult(result);
  }

  async function onBackUpPressed() {
    const done = showBusy('Preparing backup…');
    try {
      const media = {};
      for (const key of await Storage.keys('media/')) {
        const blob = await Storage.get(key);
        if (blob instanceof Blob) media[key.slice('media/'.length)] = bytesToBase64(new Uint8Array(await blob.arrayBuffer()));
      }
      const backup = { app: 'flashcards', collection: DataManager.toSnapshot(), media };
      const link = $('a', {
        href: URL.createObjectURL(new Blob([JSON.stringify(backup)], { type: 'application/json' })),
        download: `flashcards-backup-${new Date().toISOString().slice(0, 10)}.json`,
      });
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 10000);
    } catch (error) {
      toast('Could not make a backup: ' + (error.message || error));
    } finally {
      done();
    }
  }

  async function onRestoreSelected(input) {
    const file = input.files[0];
    input.value = '';
    if (!file) return;
    let backup;
    try {
      backup = JSON.parse(await file.text());
      if (!backup || backup.app !== 'flashcards' || !backup.collection) throw new Error('not a flashcards backup');
      if (Number(backup.collection.version ?? 1) > 2) throw new Error('the backup is from a newer version of the app');
    } catch (error) {
      toast(`${file.name} cannot be restored: ${error.message || error}`);
      return;
    }
    const cardCount = (backup.collection.cards || []).length;
    const ok = await confirmDialog('Restore Backup',
      `Replace every card and deck with the ${plural(cardCount, 'card')} in ${file.name}? This cannot be undone.`,
      'Replace Everything', { danger: true });
    if (!ok) return;
    const done = showBusy('Restoring…');
    try {
      for (const [name, data] of Object.entries(backup.media || {})) {
        if (Media.isPlainName(name)) {
          const extension = fileExtension(name);
          await Storage.put('media/' + name, new Blob([base64ToBytes(data)], { type: Media.MIME[extension] || 'application/octet-stream' }));
        }
      }
      AppState.selected_deck_id = DataManager.ALL_CARDS;
      DataManager.restore(backup.collection);
      toast(`Restored ${plural(cardCount, 'card')}.`);
    } catch (error) {
      toast('Could not restore: ' + (error.message || error));
    } finally {
      done();
    }
  }

  refresh();
  return { el, refresh, focus: () => deckPicker.focus() };
};

// Shows the importer's message, with the decks it filled listed below. A long
// list scrolls and long names wrap, so the dialog and its OK button always
// fit on screen.
function showImportResult(result) {
  const body = [$('p', {}, result.message)];
  const names = result.deckIds.map(id => DataManager.getDeck(id)?.name).filter(Boolean);
  if (names.length) body.push($('ul', { class: 'deck-list' }, names.map(name => $('li', {}, '• ' + name))));
  return openDialog({ title: 'Import', body, okText: 'OK', cancelText: null, width: 480 });
}

// --- Card browser: the cards in one deck, or every card.

Screens.cardBrowser = () => {
  let scope = AppState.selected_deck_id;
  if (scope !== DataManager.ALL_CARDS && !DataManager.hasDeck(scope)) {
    scope = DataManager.ALL_CARDS;
    AppState.selected_deck_id = scope;
  }
  const inDeck = scope !== DataManager.ALL_CARDS;
  let selectedId = -1;

  const title = $('div', { class: 'title' });
  const search = $('input', { type: 'search', placeholder: 'Search cards', class: 'grow', 'aria-label': 'Search cards', oninput: refresh });
  const editButton = $('button', { onclick: onEditPressed }, 'Edit');
  const removeButton = $('button', { onclick: onRemovePressed, hidden: !inDeck }, 'Remove from Deck');
  const deleteCardButton = $('button', { onclick: onDeleteCardPressed }, 'Delete Card');
  const resetButton = $('button', { onclick: onResetPressed }, 'Reset Progress');
  const tbody = $('tbody');
  const table = $('table', { class: 'cards' },
    $('colgroup', {}, $('col', { style: 'width:30%' }), $('col', { style: 'width:30%' }), $('col', { style: 'width:20%' }), $('col', { style: 'width:20%' })),
    $('thead', {}, $('tr', {}, $('th', {}, 'Front'), $('th', {}, 'Back'), $('th', {}, 'Decks'), $('th', {}, 'Progress'))),
    tbody);
  const emptyNote = $('div', { class: 'empty-note', hidden: true });
  const countLabel = $('div', { class: 'muted' });

  const el = $('div', { class: 'screen' },
    $('div', { class: 'header' },
      $('button', { onclick: goBack }, 'Back'),
      title,
      $('button', { onclick: onRenamePressed, hidden: !inDeck }, 'Rename'),
      $('button', { onclick: onDeleteDeckPressed, hidden: !inDeck }, 'Delete Deck'),
      resetButton),
    $('div', { class: 'row wrap' },
      search,
      $('button', { onclick: () => openEditor(-1) }, 'New Card'),
      editButton, removeButton, deleteCardButton),
    $('div', { class: 'table-wrap' }, table, emptyNote),
    countLabel);

  tbody.addEventListener('click', event => {
    const row = event.target.closest('tr[data-id]');
    if (row) select(Number(row.dataset.id));
  });
  tbody.addEventListener('dblclick', event => {
    const row = event.target.closest('tr[data-id]');
    if (row) openEditor(Number(row.dataset.id));
  });
  tbody.addEventListener('keydown', event => {
    const row = event.target.closest('tr[data-id]');
    if (!row) return;
    if (event.key === 'Enter') { openEditor(Number(row.dataset.id)); event.preventDefault(); }
    else if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      const next = event.key === 'ArrowDown' ? row.nextElementSibling : row.previousElementSibling;
      if (next) { select(Number(next.dataset.id)); next.focus(); }
      event.preventDefault();
    } else if (event.key === 'Delete') {
      onDeleteCardPressed();
    }
  });

  // Rebuilds the title and the list of cards from DataManager.
  function refresh() {
    if (inDeck && !DataManager.hasDeck(scope)) return;
    title.textContent = title.title = inDeck ? DataManager.getDeck(scope).name : 'All Cards';
    const deckNames = new Map(DataManager.getDecks().map(deck => [deck.id, deck.name]));
    const query = search.value.trim().toLowerCase();
    const today = Srs.today();
    const rows = [];
    for (const card of DataManager.getCards(scope)) {
      if (query && !card.front.text.toLowerCase().includes(query) && !card.back.text.toLowerCase().includes(query)) continue;
      const decks = DataManager.getCardDeckIds(card.id).map(id => deckNames.get(id)).sort((a, b) => a.localeCompare(b));
      const front = Markdown.summary(card.front);
      const back = Markdown.summary(card.back);
      const progress = Srs.describe(card.review, today);
      rows.push($('tr', { class: 'card-row' + (card.id === selectedId ? ' selected' : ''), dataset: { id: card.id }, tabIndex: 0 },
        $('td', { title: front }, front), $('td', { title: back }, back),
        $('td', { title: decks.join(', ') }, decks.join(', ')), $('td', {}, progress)));
    }
    tbody.replaceChildren(...rows);
    if (!rows.some(row => Number(row.dataset.id) === selectedId)) selectedId = -1;

    const total = DataManager.cardCount(scope);
    countLabel.textContent = rows.length === total ? plural(total, 'card') : `${rows.length} of ${total} cards`;
    emptyNote.hidden = rows.length > 0;
    emptyNote.textContent = total === 0 ? 'No cards yet. Press New Card to add one.' : 'No cards match your search.';
    updateButtons();
  }

  function select(cardId) {
    selectedId = cardId;
    for (const row of tbody.children) row.classList.toggle('selected', Number(row.dataset.id) === cardId);
    updateButtons();
  }

  function updateButtons() {
    const hasSelection = selectedId !== -1;
    editButton.disabled = !hasSelection;
    removeButton.disabled = !hasSelection;
    deleteCardButton.disabled = !hasSelection;
    resetButton.disabled = DataManager.cardCount(scope) === 0;
  }

  function openEditor(cardId) {
    AppState.editing_card_id = cardId;
    changeScreen('cardEditor');
  }

  function onEditPressed() {
    if (selectedId !== -1) openEditor(selectedId);
  }

  // Takes the card out of this deck only. It stays in All Cards.
  function onRemovePressed() {
    if (selectedId !== -1) DataManager.removeCardFromDeck(scope, selectedId);
  }

  async function onDeleteCardPressed() {
    const cardId = selectedId;
    if (cardId === -1) return;
    const decks = DataManager.getCardDeckIds(cardId).length;
    const where = decks < 2 ? '' : ` It will be removed from all ${decks} of its decks.`;
    if (await confirmDialog('Delete Card', `Delete this card?${where} This cannot be undone.`, 'Delete', { danger: true })) {
      DataManager.deleteCard(cardId);
    }
  }

  async function onRenamePressed() {
    const newName = await promptDialog('Rename Deck', title.textContent, 'Rename', 'Deck name');
    if (newName) DataManager.renameDeck(scope, newName);
  }

  async function onDeleteDeckPressed() {
    if (await confirmDialog('Delete Deck', `Delete the deck "${title.textContent}"? Its cards are kept in All Cards.`, 'Delete', { danger: true })) {
      DataManager.deleteDeck(scope);
      AppState.selected_deck_id = DataManager.ALL_CARDS;
      goBack();
    }
  }

  async function onResetPressed() {
    const count = DataManager.cardCount(scope);
    const cards = count === 1 ? 'this card' : `these ${count} cards`;
    if (await confirmDialog('Reset Progress', `Reset progress for ${cards}? Each one starts again with a first look, in every deck it belongs to.`, 'Reset')) {
      DataManager.resetProgress(DataManager.getCardIds(scope));
    }
  }

  function goBack() { changeScreen('mainMenu'); }

  refresh();
  return { el, refresh, focus: () => search.focus() };
};

// --- Side editor: edits one side of a card. The card editor holds two.

function createSideEditor(title, onChange) {
  let audio = [];
  let recorder = null;
  let recordStarted = 0;

  const statusLabel = $('div', { class: 'side-status', role: 'status' });
  const textInput = $('textarea', { placeholder: 'Text (markdown)', 'aria-label': `${title} text (markdown)`, oninput: contentChanged, onpaste: onPasteEvent });
  const audioClips = $('div', { class: 'row wrap', hidden: true });
  const preview = createCardView();
  const recordButton = $('button', { type: 'button', onclick: onRecordPressed }, 'Record');
  const imageInput = $('input', { type: 'file', accept: 'image/*', hidden: true, onchange: () => onImageFileSelected(imageInput) });
  const audioInput = $('input', { type: 'file', accept: 'audio/*,.wav,.ogg,.mp3,.m4a,.webm', hidden: true, onchange: () => onAudioFileSelected(audioInput) });

  const el = $('div', { class: 'side-editor' },
    $('div', { class: 'row' }, $('div', { class: 'side-title' }, title), statusLabel),
    $('div', { class: 'row wrap' },
      $('button', { type: 'button', onclick: () => imageInput.click() }, 'Image…'),
      $('button', { type: 'button', onclick: onDrawPressed }, 'Draw…'),
      $('button', { type: 'button', onclick: onPastePressed }, 'Paste Image'),
      $('button', { type: 'button', onclick: () => audioInput.click() }, 'Audio…'),
      recordButton),
    textInput,
    audioClips,
    $('div', { class: 'muted' }, 'Preview'),
    $('div', { class: 'panel preview' }, preview.el),
    imageInput, audioInput);

  function setSide(side) {
    textInput.value = side.text;
    audio = [...side.audio];
    refreshMedia();
  }

  const getSide = () => DataManager.makeSide(textInput.value.trim(), audio);
  // True when the side has neither text nor audio.
  const isBlank = () => textInput.value.trim() === '' && audio.length === 0;

  function contentChanged() {
    preview.showSide(getSide());
    onChange();
  }

  function refreshMedia() {
    audioClips.replaceChildren(...audio.map((name, index) =>
      $('button', { type: 'button', title: name, onclick: () => { audio.splice(index, 1); refreshMedia(); } }, `Remove audio ${index + 1}`)));
    audioClips.hidden = audio.length === 0;
    contentChanged();
  }

  const showStatus = message => { statusLabel.textContent = message; statusLabel.title = message; };

  // --- Images are stored in the media store and written into the text as
  // markdown, so they can sit anywhere among it.

  function insertImage(mediaName) {
    if (!mediaName) { showStatus('That image could not be saved.'); return; }
    // Put the image on its own line, after the line the caret is on.
    const text = textInput.value;
    let lineEnd = text.indexOf('\n', textInput.selectionStart);
    if (lineEnd === -1) lineEnd = text.length;
    const lineStart = text.lastIndexOf('\n', textInput.selectionStart - 1) + 1;
    const prefix = text.slice(lineStart, lineEnd).trim() === '' ? '' : '\n';
    const insert = `${prefix}![](${mediaName})`;
    textInput.value = text.slice(0, lineEnd) + insert + text.slice(lineEnd);
    textInput.selectionStart = textInput.selectionEnd = lineEnd + insert.length;
    showStatus('');
    textInput.focus();
    contentChanged();
  }

  async function canDecodeImage(blob) {
    const url = URL.createObjectURL(blob);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      return true;
    } catch (error) {
      return false;
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  async function storeImageBlob(blob, fallbackExtension) {
    if (!(await canDecodeImage(blob))) { showStatus('That file is not an image this browser can open.'); return; }
    const fromType = (blob.type.split('/')[1] || '').replace('svg+xml', 'svg').replace('jpeg', 'jpg');
    const extension = Media.IMAGE_TYPES.includes(fallbackExtension) ? fallbackExtension : (Media.IMAGE_TYPES.includes(fromType) ? fromType : 'png');
    insertImage(await Media.storeBlob(blob, extension));
  }

  async function onImageFileSelected(input) {
    const file = input.files[0];
    input.value = '';
    if (file) await storeImageBlob(file, fileExtension(file.name));
  }

  async function onPastePressed() {
    try {
      for (const item of await navigator.clipboard.read()) {
        const type = item.types.find(t => t.startsWith('image/'));
        if (type) { await storeImageBlob(await item.getType(type), ''); return; }
      }
      showStatus('There is no image on the clipboard.');
    } catch (error) {
      showStatus('The clipboard cannot be read here. Click the text box and press Ctrl+V (⌘V) instead.');
    }
  }

  // Pasting an image straight into the text box works too.
  function onPasteEvent(event) {
    const file = [...(event.clipboardData?.files || [])].find(f => f.type.startsWith('image/'));
    if (file) {
      event.preventDefault();
      storeImageBlob(file, fileExtension(file.name));
    }
  }

  async function onDrawPressed() {
    const pad = createSketchPad();
    const ok = await openDialog({
      title: 'Draw', width: 520, okText: 'Insert',
      body: [pad.canvas, $('div', { class: 'row', style: 'margin-top:8px' }, $('button', { type: 'button', onclick: pad.clear }, 'Clear'))],
    });
    if (ok) insertImage(await Media.storeBlob(await pad.toBlob(), 'png'));
  }

  // --- Audio

  async function addAudio(mediaName) {
    if (!mediaName || !Media.canPlay(mediaName)) {
      showStatus('That sound could not be used. WAV, OGG and MP3 files work.');
      return;
    }
    audio.push(mediaName);
    showStatus('');
    refreshMedia();
  }

  async function onAudioFileSelected(input) {
    const file = input.files[0];
    input.value = '';
    if (!file) return;
    let extension = fileExtension(file.name);
    if (!Media.AUDIO_TYPES.includes(extension)) extension = { 'audio/mpeg': 'mp3', 'audio/wav': 'wav', 'audio/ogg': 'ogg' }[file.type] || extension;
    addAudio(Media.AUDIO_TYPES.includes(extension) ? await Media.storeBlob(file, extension) : '');
  }

  async function onRecordPressed() {
    if (recorder) {
      recorder.stop();
      return;
    }
    if (!navigator.mediaDevices?.getUserMedia || !globalThis.MediaRecorder) {
      showStatus('Recording is not available in this browser.');
      return;
    }
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (error) {
      showStatus('Recording is not available. Check that this page may use the microphone.');
      return;
    }
    const type = ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/mp4', 'audio/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
    const chunks = [];
    recorder = new MediaRecorder(stream, type ? { mimeType: type } : {});
    recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
    recorder.onstop = async () => {
      stream.getTracks().forEach(track => track.stop());
      const mime = recorder.mimeType || type;
      recorder = null;
      recordButton.textContent = 'Record';
      if (!chunks.length || performance.now() - recordStarted < 100) { showStatus('Nothing was recorded.'); return; }
      const extension = mime.includes('ogg') ? 'ogg' : mime.includes('mp4') ? 'm4a' : 'webm';
      addAudio(await Media.storeBlob(new Blob(chunks, { type: mime }), extension));
    };
    recorder.start();
    recordStarted = performance.now();
    recordButton.textContent = 'Stop';
    showStatus('Recording… press Stop when done.');
  }

  function destroy() {
    if (recorder) { recorder.onstop = null; recorder.stop(); recorder.stream.getTracks().forEach(track => track.stop()); }
  }

  return { el, setSide, getSide, isBlank, focus: () => textInput.focus(), destroy };
}

// A small drawing surface: drag to draw, with a mouse, pen or finger.
function createSketchPad(width = 480, height = 320, brushRadius = 3) {
  const canvas = $('canvas', { class: 'sketch', width, height, 'aria-label': 'Drawing area' });
  const context = canvas.getContext('2d');
  let last = null;

  function clear() {
    context.fillStyle = '#fff';
    context.fillRect(0, 0, width, height);
  }

  const pointAt = event => {
    const rect = canvas.getBoundingClientRect();
    return { x: (event.clientX - rect.left) * width / rect.width, y: (event.clientY - rect.top) * height / rect.height };
  };

  function stroke(from, to) {
    context.strokeStyle = context.fillStyle = '#000';
    context.lineWidth = brushRadius * 2;
    context.lineCap = 'round';
    context.beginPath();
    context.moveTo(from.x, from.y);
    context.lineTo(to.x, to.y);
    context.stroke();
  }

  canvas.addEventListener('pointerdown', event => {
    canvas.setPointerCapture(event.pointerId);
    last = pointAt(event);
    stroke(last, last);
  });
  canvas.addEventListener('pointermove', event => {
    if (!last) return;
    const point = pointAt(event);
    stroke(last, point);
    last = point;
  });
  const stop = () => { last = null; };
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);

  clear();
  return { canvas, clear, toBlob: () => new Promise(resolve => canvas.toBlob(resolve, 'image/png')) };
}

// --- Card editor: one card's two sides and the decks it belongs to.
// Opened from a deck, when other decks hold the card too, Save keeps the
// change in this deck only by giving it its own copy; Save for All Decks
// changes the one card every deck shares.

Screens.cardEditor = () => {
  let cardId = AppState.editing_card_id;
  const scope = AppState.selected_deck_id;
  if (!DataManager.hasCard(cardId)) cardId = -1;
  const original = cardId === -1 ? null : DataManager.getCard(cardId);
  // A number is an existing deck's id. A string names a deck created on save.
  const tags = [];

  const frontEditor = createSideEditor('Front', updateSaveButtons);
  const backEditor = createSideEditor('Back', updateSaveButtons);
  const contextLabel = $('div', { class: 'context muted' });
  const chips = $('div', { class: 'chips' });
  const deckInput = $('input', {
    type: 'text', class: 'deck-input', placeholder: 'Add a deck, press Enter', 'aria-label': 'Add a deck',
    onkeydown: event => { if (event.key === 'Enter') { event.preventDefault(); onDeckNameEntered(); } },
  });
  const deckMenu = $('select', { class: 'deck-menu', 'aria-label': 'Choose a deck', onfocus: fillDeckMenu, onmousedown: fillDeckMenu, onchange: onDeckChosen });
  const progressLabel = $('div', { class: 'grow' });
  const saveButton = $('button', { onclick: () => save(false) }, 'Save');
  const saveAllButton = $('button', { onclick: () => save(true), hidden: cardId === -1 || scope === DataManager.ALL_CARDS }, 'Save for All Decks');

  const el = $('div', { class: 'screen' },
    $('div', { class: 'header' },
      $('button', { onclick: goBack }, 'Cancel'),
      $('div', { class: 'title' }, cardId === -1 ? 'New Card' : 'Edit Card'),
      $('div', { style: 'width:70px' })),
    contextLabel,
    $('div', { class: 'sides' }, frontEditor.el, backEditor.el),
    $('div', { class: 'row wrap' }, $('span', {}, 'Decks'), chips, deckInput, deckMenu),
    $('div', { class: 'row', hidden: cardId === -1 }, progressLabel,
      $('button', { onclick: onResetPressed }, 'Reset Progress')),
    $('div', { class: 'row wrap' },
      $('button', { onclick: onDeletePressed, hidden: cardId === -1 }, 'Delete Card'),
      $('div', { class: 'grow' }),
      saveButton, saveAllButton));

  // Names of the other decks that hold this card, when opened from a deck.
  function otherDeckNames() {
    if (cardId === -1 || scope === DataManager.ALL_CARDS) return [];
    return DataManager.getCardDeckIds(cardId).filter(id => id !== scope).map(id => DataManager.getDeck(id).name).sort();
  }
  const isShared = () => otherDeckNames().length > 0;

  function updateContext() {
    const others = otherDeckNames();
    if (cardId === -1) contextLabel.textContent = '';
    else if (scope === DataManager.ALL_CARDS) contextLabel.textContent = 'Changes apply in every deck that holds this card.';
    else if (!others.length) contextLabel.textContent = 'This card is only in this deck.';
    else contextLabel.textContent = `This card is also in ${others.join(', ')}. Save keeps your changes in this deck only, as a separate card. Save for All Decks changes the card everywhere.`;
    saveAllButton.title = isShared() ? '' : 'This card is only in this deck.';
  }

  // Both sides need text or audio before the card can be saved.
  function updateSaveButtons() {
    const valid = !frontEditor.isBlank() && !backEditor.isBlank();
    saveButton.disabled = !valid;
    saveAllButton.disabled = !valid || !isShared();
  }

  // --- Deck tags
  const tagName = tag => (typeof tag === 'number' ? DataManager.getDeck(tag)?.name ?? '' : tag);
  const hasTag = deckName => tags.some(tag => tagName(tag).toLowerCase() === deckName.toLowerCase());

  function addTag(tag) {
    if (typeof tag === 'string') {
      const existing = DataManager.findDeck(tag);
      if (existing !== -1) tag = existing;
    }
    if (hasTag(tagName(tag))) return;
    tags.push(tag);
    rebuildTags();
  }

  function rebuildTags() {
    chips.replaceChildren(...tags.map((tag, index) =>
      $('button', {
        type: 'button', class: 'chip', title: `Remove the card from ${tagName(tag)}`,
        onclick: () => { tags.splice(index, 1); rebuildTags(); },
      }, typeof tag === 'string' ? `${tag} (new) ×` : `${tagName(tag)} ×`)));
  }

  function onDeckNameEntered() {
    const deckName = deckInput.value.trim();
    if (deckName) addTag(deckName);
    deckInput.value = '';
  }

  // Lists the existing decks the card is not in yet.
  function fillDeckMenu() {
    const options = [$('option', { value: '' }, 'Choose…')];
    const decks = DataManager.getDecks().filter(deck => !tags.includes(deck.id));
    for (const deck of decks) options.push($('option', { value: deck.id }, deck.name));
    if (!decks.length) options.push($('option', { disabled: true }, 'No other decks'));
    deckMenu.replaceChildren(...options);
  }

  function onDeckChosen() {
    if (deckMenu.value) addTag(Number(deckMenu.value));
    fillDeckMenu();
  }

  // Turns the tags into deck ids, creating any new decks.
  const resolveTags = () => tags.map(tag => (typeof tag === 'number' ? tag : DataManager.createDeck(tag)));

  // --- Saving
  function save(forAllDecks) {
    const front = frontEditor.getSide();
    const back = backEditor.getSide();
    const contentChanged = cardId === -1
      || JSON.stringify(front) !== JSON.stringify(original.front) || JSON.stringify(back) !== JSON.stringify(original.back);
    const shared = isShared();
    // One batch, so the changes are saved once.
    DataManager.beginBatch();
    const deckIds = resolveTags();
    if (cardId === -1) {
      DataManager.createCard(front, back, deckIds);
    } else if (forAllDecks || !contentChanged || !shared) {
      DataManager.updateCard(cardId, front, back);
      DataManager.setCardDecks(cardId, deckIds);
    } else {
      saveCopyForThisDeck(front, back, deckIds);
    }
    DataManager.endBatch();
    goBack();
  }

  // Gives this deck its own edited copy. The original stays in the other decks.
  function saveCopyForThisDeck(front, back, deckIds) {
    const originalDecks = DataManager.getCardDeckIds(cardId);
    // The original keeps its other decks, except any the user removed here.
    DataManager.setCardDecks(cardId, originalDecks.filter(id => id !== scope && deckIds.includes(id)));
    // The copy takes this deck, plus any decks the user added here.
    const copyDecks = deckIds.filter(id => id === scope || !originalDecks.includes(id));
    const copyId = DataManager.createCard(front, back, copyDecks);
    // The copy is a variation of a card the user has already studied.
    DataManager.setReview(copyId, original.review);
  }

  async function onDeletePressed() {
    if (await confirmDialog('Delete Card', 'Delete this card from every deck? This cannot be undone.', 'Delete', { danger: true })) {
      DataManager.deleteCard(cardId);
      goBack();
    }
  }

  // --- Progress
  function updateProgress() {
    if (cardId !== -1) progressLabel.textContent = 'Progress: ' + Srs.describe(DataManager.getCard(cardId).review, Srs.today());
  }

  // Takes effect at once, whether or not the card's other changes are saved.
  async function onResetPressed() {
    if (await confirmDialog('Reset Progress', "Reset this card's progress? It starts again with a first look, in every deck it belongs to.", 'Reset')) {
      DataManager.resetProgress([cardId]);
      updateProgress();
    }
  }

  function goBack() { changeScreen('cardBrowser'); }

  if (cardId === -1) {
    frontEditor.setSide(DataManager.makeSide());
    backEditor.setSide(DataManager.makeSide());
    if (scope !== DataManager.ALL_CARDS && DataManager.hasDeck(scope)) tags.push(scope);
  } else {
    frontEditor.setSide(original.front);
    backEditor.setSide(original.back);
    tags.push(...DataManager.getCardDeckIds(cardId));
  }
  updateContext();
  rebuildTags();
  fillDeckMenu();
  updateProgress();
  updateSaveButtons();
  return {
    el,
    focus: () => frontEditor.focus(),
    destroy: () => { frontEditor.destroy(); backEditor.destroy(); },
  };
};

// --- Review: runs a spaced-repetition review of the selected cards. The
// session decides which card comes next; this screen only shows its state.

Screens.review = () => {
  const State = ReviewSession.State;
  const scope = DataManager.hasDeck(AppState.selected_deck_id) ? AppState.selected_deck_id : DataManager.ALL_CARDS;
  const scopeName = scope === DataManager.ALL_CARDS ? 'All Cards' : DataManager.getDeck(scope).name;
  const session = new ReviewSession(scope, AppState.review_minutes);
  // Whether the answer side has been shown for the current card.
  let revealed = false;
  let showingFront = true;

  const timerLabel = $('div', { class: 'timer muted', style: 'flex: 0 1 auto' });
  const statusLabel = $('div', { class: 'status' });
  const sideLabel = $('div', { class: 'side-label' });
  const cardView = createCardView({ textSize: 28, centered: true });
  const reviewLaterButton = $('button', { onclick: onReviewLaterPressed }, 'Review later');
  const flipButton = $('button', { onclick: onFlipPressed }, 'Show Answer');
  const missedButton = $('button', { onclick: () => onAnswer(false) }, "Didn't get it.");
  const gotItButton = $('button', { onclick: () => onAnswer(true) }, 'Got it!');
  const firstLookButton = $('button', { onclick: onFirstLookPressed }, 'Complete First Look');
  const doneButton = $('button', { onclick: goBack, hidden: true }, 'Back to Menu');
  const keysHint = $('div', { class: 'keys muted small' },
    'Keys: ', $('kbd', {}, 'Space'), ' show / flip · ', $('kbd', {}, '1'), " didn't get it · ", $('kbd', {}, '2'), ' got it / complete first look · ',
    $('kbd', {}, 'L'), ' review later');

  const el = $('div', { class: 'screen' },
    $('div', { class: 'header' },
      $('button', { onclick: goBack }, 'End Review'),
      $('div', { class: 'title', style: 'font-size:20px', title: scopeName }, scopeName),
      timerLabel),
    statusLabel,
    $('div', { class: 'panel card-panel' }, sideLabel, cardView.el),
    $('div', { class: 'controls' }, reviewLaterButton, flipButton, missedButton, gotItButton, firstLookButton, doneButton),
    keysHint);

  // The timer is the only part of the screen that changes on its own.
  const timer = setInterval(() => {
    if (!session.isTimed() || session.state !== State.REVIEWING) return;
    const levelLeft = session.levelTimeLeftMsec();
    timerLabel.textContent = levelLeft === 0
      ? "Time's up for this level. Finish this card."
      : `This level ${clockText(levelLeft)} · Total ${clockText(session.timeLeftMsec())}`;
  }, 250);

  function nextCard() {
    revealed = false;
    showingFront = true;
    show();
  }

  function show() {
    const reviewing = session.state === State.REVIEWING;
    timerLabel.hidden = !(session.isTimed() && reviewing);
    doneButton.hidden = reviewing;
    flipButton.hidden = !reviewing;
    keysHint.hidden = !reviewing;
    if (!reviewing) {
      for (const button of [reviewLaterButton, missedButton, gotItButton, firstLookButton]) button.hidden = true;
      showSummary();
      doneButton.focus();
      return;
    }

    const card = session.currentCard();
    const firstLook = session.isFirstLook();
    statusLabel.textContent = firstLook
      ? `First look · Level 0 · Card ${session.positionInBucket()} of ${session.bucketSize()}`
      : `Level ${session.level} · Bucket ${session.bucketNumber} · Card ${session.positionInBucket()} of ${session.bucketSize()}`;
    sideLabel.textContent = showingFront ? 'FRONT' : 'BACK';
    cardView.showSide(showingFront ? card.front : card.back);

    flipButton.textContent = revealed ? 'Flip' : 'Show Answer';
    const canDefer = session.canReviewLater();
    reviewLaterButton.hidden = firstLook || revealed;
    reviewLaterButton.disabled = !canDefer;
    reviewLaterButton.title = canDefer ? '' : 'Already put off once today.';
    missedButton.hidden = !revealed || firstLook;
    gotItButton.hidden = !revealed || firstLook;
    firstLookButton.hidden = !revealed || !firstLook;
  }

  function showSummary() {
    sideLabel.textContent = '';
    const answered = session.gotItCount + session.missedCount;
    const summary = `Got it: ${session.gotItCount} · Didn't get it: ${session.missedCount} · First looks: ${session.firstLookCount}`;
    if (session.state === State.OUT_OF_TIME) {
      const due = Srs.countDue(DataManager.getCards(scope), Srs.today());
      statusLabel.textContent = "Time's up";
      cardView.showMessage(`Time's up. ${plural(due, 'card is', 'cards are')} still due.\n\n${summary}`);
    } else if (answered + session.firstLookCount === 0) {
      statusLabel.textContent = 'Nothing due';
      cardView.showMessage('Nothing is due right now. Come back later.');
    } else {
      statusLabel.textContent = 'Review complete';
      cardView.showMessage(`Review complete. Level 0 is empty.\n\n${summary}`);
    }
  }

  function onFlipPressed() {
    revealed = true;
    showingFront = !showingFront;
    show();
  }

  function onAnswer(gotIt) { session.answer(gotIt); nextCard(); }
  function onFirstLookPressed() { session.firstLook(); nextCard(); }
  function onReviewLaterPressed() { session.reviewLater(); nextCard(); }

  // A key works only while its button is showing and enabled.
  function onKey(event) {
    if (event.ctrlKey || event.metaKey || event.altKey || document.querySelector('dialog[open]')) return;
    if (event.target.closest('input, textarea, select')) return;
    const press = button => {
      if (button.hidden || button.disabled) return;
      event.preventDefault();
      button.click();
    };
    const key = event.key.toLowerCase();
    if (key === ' ' || key === 'f') press(flipButton);
    else if (key === '1') press(missedButton);
    else if (key === '2') { press(gotItButton); press(firstLookButton); }
    else if (key === 'l') press(reviewLaterButton);
    else if (key === 'escape') goBack();
  }
  document.addEventListener('keydown', onKey);

  function goBack() { changeScreen('mainMenu'); }

  session.start();
  nextCard();
  return {
    el,
    destroy: () => { clearInterval(timer); document.removeEventListener('keydown', onKey); },
  };
};

function clockText(msec) {
  const seconds = Math.ceil(msec / 1000);
  return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
}

// =============================================================================
// Start-up. The first time, the bundled Anki deck is imported, through the
// same importer the Import button uses.
// =============================================================================

async function importBundledDeck() {
  const holder = document.getElementById('bundled-deck');
  const data = holder ? holder.textContent.trim() : '';
  if (!data || data.startsWith('__')) return [];
  const result = await new AnkiImporter().importPackage(base64ToBytes(data), holder.dataset.name);
  return result.deckIds;
}

async function main() {
  await Storage.open();
  if (!(await DataManager.load())) {
    let deckIds = [];
    try {
      deckIds = await importBundledDeck();
    } catch (error) {
      console.error('Could not import the bundled deck', error);
    }
    if (deckIds.length === 0) deckIds = [DataManager.createSampleDeck()];
    AppState.selected_deck_id = deckIds[0];
    await DataManager.save();
  }
  changeScreen('mainMenu');
}

main().catch(error => {
  console.error(error);
  app.replaceChildren($('div', { class: 'screen' }, $('p', {}, 'Flashcards could not start: ' + (error.message || error))));
});
