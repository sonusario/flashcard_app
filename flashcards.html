<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcards</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20rx='3'%20fill='%232e2e31'/%3E%3Crect%20x='4.5'%20y='2.5'%20width='9'%20height='7'%20rx='1'%20fill='%233c5a80'%20stroke='%2373b3ff'%20stroke-width='1'/%3E%3Crect%20x='2.5'%20y='6.5'%20width='9'%20height='7'%20rx='1'%20fill='%232e2e31'%20stroke='%23ececee'%20stroke-width='1'/%3E%3Cpath%20d='M4.5%209.5h5M4.5%2011.5h3'%20stroke='%2373b3ff'%20stroke-width='1'/%3E%3C/svg%3E">
<!--
  Flashcards: a single-file web version of the Godot 4 "Flashcards" project
  (Part 5: Anki import). Everything the Godot app does is here: cards that
  belong to any number of decks, markdown with images and audio, Leitner
  reviews on golden-ratio intervals with buckets and time shares, and import
  of Anki .apkg packages (old and current formats).

  The layout of this script follows the Godot project, one section per file:
  Storage, Media, DataManager, AppState, Srs, ReviewSession, Markdown,
  HtmlToMarkdown, the Anki readers (ZIP, Zstandard, SQLite, Protocol
  Buffers), AnkiImporter, then the components and the four screens.
  Data is kept in this browser's IndexedDB; use Back Up to keep a copy.
-->
<style>
:root {
  --bg: #4b4b4f;
  --panel: #2e2e31;
  --field: #252528;
  --button: #2a2a2d;
  --button-hover: #38383c;
  --button-active: #1f1f22;
  --border: #5c5c62;
  --text: #ececee;
  --muted: #b4b4ba;
  --disabled: #85858b;
  --accent: #73b3ff;
  --selected: #3c5a80;
  --danger: #ff8a80;
  --chip: #3a3a3e;
  --shadow: 0 10px 40px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e9eaee;
    --panel: #ffffff;
    --field: #f6f7f9;
    --button: #dfe1e6;
    --button-hover: #d2d5dc;
    --button-active: #c3c7cf;
    --border: #c3c6cd;
    --text: #1d1e22;
    --muted: #5a5d66;
    --disabled: #9a9ca3;
    --accent: #1f6fd1;
    --selected: #cfe1fb;
    --danger: #c62828;
    --chip: #e3e5ea;
    --shadow: 0 10px 40px rgba(0, 0, 0, .2);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e9eaee; --panel: #ffffff; --field: #f6f7f9; --button: #dfe1e6;
  --button-hover: #d2d5dc; --button-active: #c3c7cf; --border: #c3c6cd;
  --text: #1d1e22; --muted: #5a5d66; --disabled: #9a9ca3; --accent: #1f6fd1;
  --selected: #cfe1fb; --danger: #c62828; --chip: #e3e5ea;
  --shadow: 0 10px 40px rgba(0, 0, 0, .2); color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button {
  background: var(--button);
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 6px 12px;
  cursor: pointer;
  white-space: nowrap;
}
button:hover:not(:disabled) { background: var(--button-hover); }
button:active:not(:disabled) { background: var(--button-active); }
button:disabled { color: var(--disabled); cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, tr:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
input[type="text"], input[type="search"], input[type="number"], select, textarea {
  background: var(--field);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px 8px;
  min-width: 0;
}
select { padding: 6px 4px; }
textarea { resize: vertical; width: 100%; }
[hidden] { display: none !important; }

#app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.screen { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 24px; min-height: 0; min-width: 0; }
@media (max-width: 640px) { .screen { padding: 16px; } }
.row { display: flex; gap: 8px; align-items: center; min-width: 0; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.equal > * { flex: 1 1 0; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.header .title {
  flex: 1 1 200px; text-align: center; font-size: 22px; font-weight: 600; min-width: 0; overflow-wrap: anywhere;
  /* A very long deck name is cut to two lines; the full name is in the tooltip. */
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden;
}
.panel { background: var(--panel); border-radius: 6px; }
.status { text-align: center; }

/* Main menu */
.center { flex: 1; display: grid; place-items: center; padding: 24px 16px; }
.menu { width: min(380px, 100%); display: flex; flex-direction: column; gap: 12px; }
.menu h1 { font-size: 40px; text-align: center; margin: 0 0 4px; font-weight: 600; }
.menu select { width: 100%; }
.menu hr { width: 100%; border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
.time-row input { width: 84px; text-align: right; }

/* Card browser */
.table-wrap { flex: 1 1 300px; overflow: auto; background: var(--panel); border-radius: 6px; min-height: 200px; }
table.cards { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 560px; }
table.cards th {
  position: sticky; top: 0; background: var(--panel); text-align: left; font-weight: 600;
  padding: 8px 10px; border-bottom: 1px solid var(--border); z-index: 1;
}
table.cards td { padding: 6px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid color-mix(in srgb, var(--border) 40%, transparent); }
table.cards tr.card-row { cursor: default; }
table.cards tr.card-row:hover td { background: color-mix(in srgb, var(--selected) 35%, transparent); }
table.cards tr.selected td { background: var(--selected); }
table.cards th.check, table.cards td.check { padding: 0; text-align: center; }
table.cards input[type="checkbox"] { width: 16px; height: 16px; margin: 0; vertical-align: middle; cursor: pointer; }
table.cards tbody { user-select: none; }
.empty-note { padding: 24px; text-align: center; color: var(--muted); }

/* Card editor */
.sides { display: flex; gap: 16px; flex: 1 1 auto; min-height: 0; flex-wrap: wrap; }
.side-editor { flex: 1 1 320px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.side-editor .side-title { font-size: 19px; font-weight: 600; }
.side-editor .side-status { flex: 1; text-align: right; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-editor textarea { min-height: 120px; flex: 1 1 140px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
.preview { padding: 8px; min-height: 100px; max-height: 300px; overflow: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 200px; min-width: 0; }
.chip { background: var(--chip); max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.deck-input { width: 220px; flex: 0 1 220px; }
.deck-menu { flex: 0 1 auto; width: 160px; }
.context { overflow-wrap: anywhere; }

/* Review */
/* The review fits the window: a long card scrolls inside its panel, so the
   answer buttons never move off screen. */
.review-screen { flex: none; height: 100vh; height: 100dvh; }
.card-panel { flex: 1 1 auto; display: flex; flex-direction: column; padding: 24px; min-height: 200px; min-width: 0; }
.review-screen .card-panel { min-height: 0; }
@media (max-width: 640px) { .card-panel { padding: 16px; } }
.side-label { text-align: center; letter-spacing: .06em; font-size: 13px; color: var(--muted); }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
.controls > button { flex: 1 1 140px; padding: 10px 12px; }
.timer { text-align: right; font-variant-numeric: tabular-nums; }
.keys { text-align: center; }
kbd { border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; font-size: 12px; }

/* Card view: one side of a card, drawn from markdown */
.card-view { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; flex: 1 1 auto; }
.card-view .md { overflow-wrap: anywhere; min-width: 0; }
.card-view.centered { text-align: center; }
/* Two empty spacers centre a short card; a long one fills the panel and scrolls. */
.card-view.centered::before, .card-view.centered::after { content: ''; flex: 1 1 0; }
.card-view.centered .md { overflow: auto; min-height: 0; flex: 0 1 auto; }
.card-view.centered .audio-row { flex: none; }
/* A list stays a centred block, but its lines read from the left. */
.card-view.centered .md .md-list { display: table; margin-left: auto; margin-right: auto; text-align: left; }
.card-view .audio-row { display: flex; flex-wrap: wrap; gap: 6px; }
.card-view.centered .audio-row { justify-content: center; }
.card-view .message { white-space: pre-line; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md .md-h, .md .md-list, .md blockquote, .md pre, .md table, .md hr { margin: 0 0 1em; }
.md .md-h { font-weight: 700; line-height: 1.2; }
.md .md-li { padding-left: calc(var(--depth) * 1.4em); }
.card-view.centered .md .md-li { padding-left: calc(var(--depth) * 1.4em + 1em); text-indent: -1em; }
.md blockquote { font-style: italic; padding-left: 1.4em; margin-left: 0; }
.md pre, .md code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em; }
.md pre { background: var(--field); padding: 8px 10px; border-radius: 4px; overflow: auto; text-align: left; white-space: pre; }
.md code { background: var(--field); padding: 0 3px; border-radius: 3px; }
.md hr { border: 0; border-top: 2px solid currentColor; opacity: .8; width: 90%; }
.md table { border-collapse: collapse; }
.card-view.centered .md table { margin-left: auto; margin-right: auto; }
.md td, .md th { padding: 2px 12px; }
.md img { max-width: 100%; height: auto; display: inline-block; vertical-align: middle; }
.md a { color: var(--accent); }
.md .missing { font-style: italic; color: var(--muted); }

/* Dialogs */
dialog {
  background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
  padding: 0; box-shadow: var(--shadow);
  width: min(var(--dialog-width, 420px), calc(100vw - 32px));
  max-width: calc(100vw - 32px);
  max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px);
}
dialog[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: rgba(0, 0, 0, .45); }
.dialog-title { padding: 12px 16px 0; font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.dialog-body { padding: 12px 16px; overflow: auto; min-height: 0; overflow-wrap: anywhere; }
.dialog-body p { margin: 0 0 8px; white-space: pre-line; }
.dialog-body input[type="text"] { width: 100%; }
.link-button { align-self: center; background: none; border: 0; padding: 2px 6px; text-decoration: underline; cursor: pointer; }
.link-button:hover { background: none; color: var(--text); }
.about a { color: var(--accent); }
.about-log { margin: 0; padding-left: 0; list-style: none; font-size: 13px; }
.about-log li { margin: 0 0 4px; }
.about-log time { color: var(--muted); margin-right: 8px; font-variant-numeric: tabular-nums; }
.dialog-buttons { display: flex; justify-content: flex-end; gap: 8px; padding: 0 16px 14px; flex-wrap: wrap; }
/* The import result lists one deck per line. A long list scrolls and a long
   name wraps, so the dialog and its OK button always stay on screen. */
.deck-list { --line: 1.45em; max-height: calc(var(--line) * 6); overflow-y: auto; overflow-x: hidden; margin: 0; padding: 0; list-style: none; line-height: var(--line); }
.deck-list li { overflow-wrap: anywhere; padding-left: 1em; text-indent: -1em; }
/* The deck choices in Change Decks: a long list scrolls inside the dialog. */
.check-list { max-height: min(40vh, 320px); overflow-y: auto; margin: 0; padding: 4px 0; list-style: none; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.check-list label { display: flex; gap: 8px; align-items: baseline; padding: 3px 2px; overflow-wrap: anywhere; cursor: pointer; }
.check-list input, .check-option input { flex: none; }
.check-option { display: flex; gap: 8px; align-items: baseline; margin: 4px 0 8px; cursor: pointer; }
.sketch { display: block; max-width: 100%; height: auto; touch-action: none; cursor: crosshair; border: 1px solid var(--border); background: #fff; }
.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--panel);
  border: 1px solid var(--border); border-radius: 6px; padding: 8px 14px; box-shadow: var(--shadow);
  max-width: calc(100vw - 32px); z-index: 10; overflow-wrap: anywhere;
}
.busy { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.35); z-index: 20; }
.busy > div { background: var(--panel); padding: 16px 20px; border-radius: 8px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); overflow-wrap: anywhere; }
</style>
</head>

<script>
'use strict';

// =============================================================================
// Helpers
// =============================================================================

const $ = (tag, props = {}, ...children) => {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value == null || value === false) continue;
    if (key === 'class') el.className = value;
    else if (key === 'style') el.style.cssText = value;
    else if (key === 'dataset') Object.assign(el.dataset, value);
    else if (key.startsWith('on')) el.addEventListener(key.slice(2), value);
    else if (key in el && key !== 'list' && key !== 'form') el[key] = value;
    else el.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    el.append(child instanceof Node ? child : String(child));
  }
  return el;
};

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function plural(count, singular, pluralText) {
  if (count === 1) return '1 ' + singular;
  return `${count} ${pluralText || singular + 's'}`;
}

const utf8 = new TextDecoder('utf-8');

function base64ToBytes(text) {
  const binary = atob(text.replace(/\s+/g, ''));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function bytesToBase64(bytes) {
  let binary = '';
  for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(binary);
}

function fileExtension(name) {
  const dot = name.lastIndexOf('.');
  return dot === -1 ? '' : name.slice(dot + 1).toLowerCase();
}

function toast(message, ms = 4000) {
  const el = $('div', { class: 'toast', role: 'status' }, message);
  document.body.append(el);
  setTimeout(() => el.remove(), ms);
}

function showBusy(message) {
  const el = $('div', { class: 'busy' }, $('div', {}, message));
  document.body.append(el);
  return () => el.remove();
}

// Lets the browser draw before a long piece of work starts.
const nextFrame = () => new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 0)));

// SHA-256, used to name media files by their contents.
async function sha256Hex(bytes) {
  if (globalThis.crypto && crypto.subtle) {
    const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
    return Array.from(digest, b => b.toString(16).padStart(2, '0')).join('');
  }
  return sha256Fallback(bytes);
}

// Plain-script SHA-256 for browsers that hide crypto.subtle (some file:// pages).
